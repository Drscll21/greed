<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>$GREED — Rose Island International Greed Tournament</title>
<style>
  :root{
    --bg-1:#241610;
    --bg-2:#140c09;
    --gold:#d9724a;
    --gold-2:#c0522a;
    --hot-pink:#e8935a;
    --electric:#2a9d8f;
    --green:#8fae5c;
    --card-bg:#2e1c14;
    --card-border:#4a3021;
    --text:#f7ede4;
    --text-dim:#c2a58f;
    --danger:#e8935a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(192,82,42,0.3), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(42,157,143,0.2), transparent 45%),
      linear-gradient(160deg,var(--bg-1),var(--bg-2));
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding:16px;
    padding-bottom:40px;
  }
  h1,h2,h3{margin:0;}
  button{font-family:inherit; cursor:pointer; border:none; -webkit-tap-highlight-color:transparent;}
  input{font-family:inherit;}
  ::selection{background:var(--gold); color:#000;}

  .wrap{max-width:900px; margin:0 auto;}

  /* ---------- Header ---------- */
  .app-header{
    text-align:center;
    padding:18px 10px 22px;
  }
  .app-header .title{
    font-size:clamp(28px,7vw,44px);
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,var(--gold),var(--hot-pink),var(--electric));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 6s linear infinite;
    text-transform:uppercase;
  }
  @keyframes shine{ to{ background-position:200% center; } }
  .app-header .subtitle{
    font-size:12px;
    letter-spacing:4px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-top:4px;
  }

  .admin-gear{
    position:fixed; top:14px; right:14px; z-index:50;
    width:44px; height:44px; border-radius:50%;
    background:var(--card-bg); border:2px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .admin-gear:active{ transform:scale(0.92); }

  /* ---------- Card shell ---------- */
  .panel{
    background:rgba(36,18,56,0.7);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:20px;
    backdrop-filter:blur(6px);
  }

  /* ---------- Buttons ---------- */
  .btn{
    border-radius:14px;
    padding:14px 18px;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    transition:transform .1s ease, filter .15s ease;
    color:#0f0620;
  }
  .btn:active{ transform:scale(0.95); }
  .btn-primary{ background:linear-gradient(135deg,var(--gold),var(--gold-2)); box-shadow:0 4px 0 #7a3117,0 8px 18px rgba(192,82,42,0.35); color:#fff5ee;}
  .btn-primary:active{ box-shadow:0 1px 0 #7a3117; }
  .btn-secondary{ background:linear-gradient(135deg,#4a3021,#331f15); color:var(--text); border:1px solid var(--card-border);}
  .btn-pink{ background:linear-gradient(135deg,var(--hot-pink),#c46a35); color:#fff5ee; box-shadow:0 4px 0 #8f4a1f,0 8px 18px rgba(232,147,90,0.3);}
  .btn-pink:active{ box-shadow:0 1px 0 #8f4a1f; }
  .btn-cyan{ background:linear-gradient(135deg,var(--electric),#1f766b); color:#f1fbf9; box-shadow:0 4px 0 #14504a,0 8px 18px rgba(42,157,143,0.3);}
  .btn-cyan:active{ box-shadow:0 1px 0 #14504a; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px dashed var(--card-border);}
  .btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none !important; filter:grayscale(0.4);}
  .btn-block{ width:100%; }

  /* ---------- SETUP SCREEN ---------- */
  .setup-row{
    display:flex; gap:8px; align-items:center; margin-bottom:10px;
  }
  .setup-row input[type=text]{
    flex:1;
    padding:14px 16px;
    border-radius:12px;
    border:2px solid var(--card-border);
    background:#1a0e2b;
    color:var(--text);
    font-size:16px;
    font-weight:600;
  }
  .setup-row input[type=text]:focus{ outline:none; border-color:var(--gold); }
  .row-cpu{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex-shrink:0; }
  .row-cpu input{ width:18px; height:18px; accent-color:var(--electric); cursor:pointer; }
  .row-cpu label{ font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); cursor:pointer; }
  .row-remove{
    width:42px; height:42px; flex-shrink:0;
    border-radius:10px;
    background:rgba(232,147,90,0.15);
    color:var(--hot-pink);
    font-size:20px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(232,147,90,0.3);
  }
  .row-remove:disabled{ opacity:0.2; }

  .chips-label{
    font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--text-dim);
    margin:18px 0 8px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:9px 14px;
    border-radius:20px;
    background:rgba(42,157,143,0.15);
    border:1px solid rgba(42,157,143,0.4);
    color:var(--electric);
    font-size:14px; font-weight:700;
  }
  .chip.added{ background:rgba(247,237,228,0.05); border-color:var(--card-border); color:var(--text-dim); }
  .chip:active{ transform:scale(0.94); }

  .setup-error{
    color:var(--hot-pink); font-weight:700; font-size:14px;
    text-align:center; margin-top:10px; min-height:20px;
  }

  /* ---------- Banner ---------- */
  .banner{
    text-align:center;
    padding:14px;
    border-radius:14px;
    margin-bottom:16px;
    font-weight:900;
    font-size:clamp(16px,5vw,24px);
    letter-spacing:2px;
    text-transform:uppercase;
    border:1px solid var(--card-border);
  }
  .banner.first-to{ background:rgba(192,82,42,0.14); color:var(--gold); border-color:rgba(192,82,42,0.4);}
  .banner.end-times{
    background:rgba(232,147,90,0.2); color:var(--hot-pink); border-color:rgba(232,147,90,0.55);
    animation:pulse-banner 1.4s ease-in-out infinite;
  }
  .banner.winner{ background:rgba(143,174,92,0.18); color:var(--green); border-color:rgba(143,174,92,0.5); font-size:clamp(20px,6vw,30px);}
  .banner.tie{ background:rgba(255,255,255,0.08); color:var(--text); }
  .banner.final-round{
    background:rgba(143,174,92,0.28); color:var(--green); border-color:rgba(143,174,92,0.7);
    animation:pulse-banner 1.4s ease-in-out infinite;
  }
  .banner.bonus-flash{
    background:rgba(232,147,90,0.3); color:var(--gold); border-color:rgba(232,147,90,0.7);
    animation:flash-pop 0.5s ease-out;
  }
  @keyframes flash-pop{ 0%{ transform:scale(0.96); opacity:0.5; } 60%{ transform:scale(1.02); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes pulse-banner{ 0%,100%{opacity:1;} 50%{opacity:0.6;} }

  .banner-stats{
    text-align:center;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:none;
    color:var(--text-dim);
    margin-top:-8px;
    margin-bottom:16px;
    min-height:16px;
  }
  .banner-stats .stat-sep{ opacity:0.4; margin:0 8px; }
  .banner .stat-hot, .banner-stats .stat-hot{ color:var(--hot-pink); }
  .banner .stat-cold, .banner-stats .stat-cold{ color:var(--electric); }

  /* ---------- Player cards ---------- */
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .p-card{
    position:relative;
    background:var(--card-bg);
    border:2px solid var(--card-border);
    border-radius:16px;
    padding:14px 12px;
    text-align:center;
    transition:all .2s ease;
  }
  .p-card.active{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(192,82,42,0.3), 0 8px 20px rgba(192,82,42,0.18);
    transform:translateY(-2px);
  }
  .p-card.leader{ border-color:var(--green); box-shadow:0 0 0 3px rgba(143,174,92,0.25);}
  .p-card.eliminated{ opacity:0.4; filter:grayscale(0.6); }
  .p-card.winner-card{ border-color:var(--gold); box-shadow:0 0 0 4px rgba(192,82,42,0.4), 0 0 30px rgba(192,82,42,0.4); animation:winner-glow 1.6s ease-in-out infinite; }
  @keyframes winner-glow{ 0%,100%{box-shadow:0 0 0 4px rgba(192,82,42,0.4), 0 0 30px rgba(192,82,42,0.4);} 50%{box-shadow:0 0 0 4px rgba(192,82,42,0.65), 0 0 45px rgba(192,82,42,0.7);} }

  .p-card .badge{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:900; letter-spacing:1.5px;
    padding:3px 10px; border-radius:10px;
    text-transform:uppercase; white-space:nowrap;
  }
  .badge.your-turn{ background:var(--gold); color:#241610; }
  .badge.leader-badge{ background:var(--green); color:#1c2712; }
  .badge.out-badge{ background:var(--card-border); color:var(--text-dim); }

  .p-name .cpu-tag{ font-size:10px; color:var(--electric); margin-left:4px; vertical-align:middle; }
  .p-total{ font-size:28px; font-weight:900; color:var(--gold); margin-top:4px; font-variant-numeric:tabular-nums;}
  .p-card.active .p-total{ color:var(--gold); }
  .p-last{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .p-needs{ font-size:11px; color:var(--hot-pink); font-weight:700; margin-top:4px;}
  .p-achievements{ display:flex; justify-content:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .achv-pill{
    font-size:11px; font-weight:800;
    padding:2px 7px; border-radius:9px;
    display:inline-flex; align-items:center; gap:3px;
  }
  .achv-pill.greed{ background:rgba(232,147,90,0.18); color:var(--hot-pink); }
  .achv-pill.six{ background:rgba(42,157,143,0.18); color:var(--electric); }

  /* ---------- Score entry ---------- */
  .entry-panel{ margin-top:6px; }

  .manual-entry{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .manual-entry input[type=number]{
    flex:1; padding:16px; border-radius:12px; border:2px solid var(--card-border);
    background:#1a0e2b; color:var(--text); font-size:20px; font-weight:800; text-align:center;
  }
  .manual-entry input[type=number]:focus{ outline:none; border-color:var(--gold); }
  .manual-entry .btn{ flex-shrink:0; }

  .quick-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;
  }
  .quick-btn{
    padding:16px 8px; border-radius:12px;
    background:linear-gradient(135deg,#3a251a,#291810);
    border:1px solid var(--card-border);
    color:var(--text); font-weight:800; font-size:16px;
  }
  .quick-btn:active{ background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#fff5ee; transform:scale(0.94);}

  .bonus-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;
  }
  .bonus-btn{ padding:16px 8px; border-radius:12px; font-size:14px; }

  .action-row{ display:flex; gap:10px; margin-top:8px; }
  .action-row .btn{ flex:1; }

  /* ---------- Leaderboard ---------- */
  .lb-section{ margin-top:26px; }
  .lb-title{
    font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim);
    margin-bottom:10px; text-align:center;
  }
  .lb-list{ display:flex; flex-direction:column; gap:6px; }
  .lb-row{
    display:flex; align-items:center; gap:10px;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:10px 14px;
  }
  .lb-rank{ font-weight:900; color:var(--gold); width:24px; }
  .lb-name{ flex:1; font-weight:700; }
  .lb-wins{ font-weight:900; color:var(--electric); }

  /* ---------- Score history log ---------- */
  .history-log-list{
    display:flex; flex-direction:column-reverse; gap:6px;
    max-height:340px; overflow-y:auto;
  }
  .history-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:8px; padding:8px 12px; font-size:13px;
  }
  .history-row.is-undo{ border-color:rgba(232,147,90,0.5); background:rgba(232,147,90,0.08); }
  .history-row .h-text{ font-weight:700; }
  .history-row.is-undo .h-text{ color:var(--hot-pink); }
  .history-row .h-time{ font-size:10px; color:var(--text-dim); white-space:nowrap; }
  .history-empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:16px; }

  /* ---------- Winner screen ---------- */
  .winner-screen{ text-align:center; padding:30px 10px; }
  .trophy{ font-size:64px; }
  .winner-name{
    font-size:clamp(26px,8vw,40px); font-weight:900; color:var(--gold);
    text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px;
  }
  .winner-total{ font-size:20px; color:var(--text-dim); font-weight:700;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1a0e2b; border:1px solid var(--card-border);
    padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700;
    z-index:100; opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .toast.show{ opacity:1; }

  /* ---------- Admin modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center; z-index:200;
    padding:16px;
  }
  .modal{
    background:var(--bg-1); border:1px solid var(--card-border); border-radius:18px;
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px;
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{ width:36px; height:36px; border-radius:50%; background:var(--card-bg); font-size:18px; color:var(--text);}
  .admin-pw-input{
    width:100%; padding:14px; border-radius:12px; border:2px solid var(--card-border);
    background:#1a0e2b; color:var(--text); font-size:16px; margin-bottom:12px;
  }
  .admin-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .admin-tab{
    flex:1; padding:10px; border-radius:10px; background:var(--card-bg);
    color:var(--text-dim); font-weight:700; font-size:13px; border:1px solid var(--card-border);
  }
  .admin-tab.active{ background:var(--gold); color:#fff5ee; border-color:var(--gold); }
  .admin-row{
    display:flex; gap:6px; align-items:center; background:var(--card-bg);
    border:1px solid var(--card-border); border-radius:10px; padding:8px 10px; margin-bottom:8px;
  }
  .admin-row .aname{ flex:1; font-weight:700; font-size:14px; word-break:break-word;}
  .admin-row input[type=text],.admin-row input[type=number]{
    width:64px; padding:8px; border-radius:8px; border:1px solid var(--card-border);
    background:#1a0e2b; color:var(--text); font-size:13px; text-align:center;
  }
  .admin-row input.stat-input{ width:52px; }
  .admin-mini-btn{
    padding:8px 10px; border-radius:8px; font-size:11px; font-weight:800; text-transform:uppercase;
  }
  .admin-add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .admin-add-row input{ flex:1; padding:12px; border-radius:10px; border:2px solid var(--card-border); background:#1a0e2b; color:var(--text); }
  .stat-labels{ display:flex; gap:4px; font-size:9px; color:var(--text-dim); text-align:center; margin-left:auto; }
  .stat-col{ width:52px; }
  .sync-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .sync-dot.on{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .sync-dot.off{ background:var(--text-dim); }
  .status-line{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:6px; }

  .hidden{ display:none !important; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:2px; color:var(--text-dim); margin:14px 0 8px;}

  /* ---------- DICE TRAY (hybrid roll, manual selection) ---------- */
  .dice-tray{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; align-items:stretch; }
  .dice-main{ flex:1 1 300px; min-width:260px; }
  .dice-side{ flex:0 0 170px; min-width:150px; background:rgba(143,174,92,0.08); border:1px dashed rgba(192,82,42,0.4); border-radius:14px; padding:12px; display:flex; flex-direction:column; }
  .side-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); text-align:center; margin-bottom:6px; }
  .score-guide{ margin-top:12px; padding-top:10px; border-top:1px solid var(--card-border); font-size:11px; color:var(--text-dim); }
  .score-guide h4{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin:0 0 6px; text-align:center; }
  .score-guide ul{ list-style:none; margin:0; padding:0; }
  .score-guide li{ display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .score-guide .sg-k{ white-space:nowrap; }
  .score-guide .sg-v{ color:var(--green); font-weight:800; font-variant-numeric:tabular-nums; }
  .score-guide .sg-note{ font-size:10px; opacity:0.7; margin-top:6px; text-align:center; line-height:1.3; }
  .dice-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:72px; align-items:center; perspective:700px; }
  .dice-row.side{ min-height:64px; justify-content:flex-start; align-content:flex-start; }
  .dice-prompt{ color:var(--text-dim); font-size:14px; text-align:center; }
  .die{ width:62px; height:62px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900; box-shadow:0 4px 8px rgba(0,0,0,0.35); user-select:none; background:var(--text); color:#241610; transform-style:preserve-3d; }
  .die.dollar{ background:var(--electric); color:#f1fbf9; border:2px solid #5fd0c2; }
  .die.g{ background:#ffd400; color:#1a1a1a; border:2px solid #e6b800; }
  .die.r{ background:var(--gold-2); color:#fff5ee; border:2px solid var(--hot-pink); }
  .die.e-red{ background:#9b2226; color:#fff; border:2px solid #e07a7a; }
  .die.e-pink{ background:#db2777; color:#fff; border:2px solid #f472b6; }
  .die.d{ background:#0a0a0a; color:#f5f5f5; border:2px solid #3a3a3a; }
  .die.selectable{ cursor:pointer; transition:transform .1s ease, box-shadow .1s ease; }
  .die.selectable:hover{ transform:translateY(-3px) scale(1.05); box-shadow:0 0 0 3px rgba(192,82,42,0.55), 0 6px 14px rgba(0,0,0,0.4); }
  .die.banked{ outline:3px solid var(--green); outline-offset:1px; cursor:pointer; }
  .die.banked:hover{ transform:scale(0.95); }
  .die.rolling{ animation:tumble 0.42s linear infinite; will-change:transform; }
  @keyframes tumble{
    0%{ transform:translateY(0) rotateX(0deg) rotateY(0deg); }
    25%{ transform:translateY(-12px) rotateX(200deg) rotateY(110deg); }
    50%{ transform:translateY(0) rotateX(400deg) rotateY(220deg); }
    75%{ transform:translateY(-8px) rotateX(560deg) rotateY(300deg); }
    100%{ transform:translateY(0) rotateX(720deg) rotateY(360deg); }
  }
  .die.land{ animation:landpop 0.36s cubic-bezier(.18,.89,.32,1.28); }
  @keyframes landpop{
    0%{ transform:scale(1.35) translateY(-10px); }
    55%{ transform:scale(0.9) translateY(3px); }
    100%{ transform:scale(1) translateY(0); }
  }
  .dice-controls{ display:flex; gap:10px; flex:1 1 100%; }
  .dice-controls .btn{ flex:1; }
  .btn-sm{ padding:8px 12px; font-size:12px; margin-top:8px; width:100%; }
  .dice-hint{ text-align:center; font-size:12px; color:var(--text-dim); margin-top:8px; min-height:16px; }
</style>
</head>
<body>

<div class="admin-gear" id="adminGear" onclick="openAdmin()">⚙</div>
<div class="toast" id="toast"></div>

<div class="wrap">
  <div class="app-header">
    <div class="title">$ Greed</div>
    <div class="subtitle">Rose Island International Greed Tournament</div>
  </div>

  <!-- ================= SETUP SCREEN ================= -->
  <!-- ================= RESUME GAME (shown only if a cached game is found) ================= -->
  <div id="resumePanel" class="panel hidden" style="margin-bottom:16px; border-color:var(--electric);">
    <h3 style="text-align:center; color:var(--electric); margin-bottom:8px;">⏸ Unfinished Game Found</h3>

<script>
/* =========================================================================
   $GREED — full rebuild per GREED-mechanics.md spec
   ========================================================================= */

// ---------------- Cloud config ----------------
const SUPABASE_URL = "https://acejxcdqdxscewmqoucp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wnfbHEAZLhLVFVGIxoEF1g_54hKjn7G";
const SB = (SUPABASE_URL && SUPABASE_ANON_KEY) ? { url: SUPABASE_URL, key: SUPABASE_ANON_KEY } : null;

const QUICK_ADDS = [50, 100, 250, 300, 350, 450, 500, 750, 1000];
const ADMIN_PASSWORD = "roseisland";
const LS_SAVED_PLAYERS = "greed-saved-players-v1";
const LS_LEADERBOARD = "greed-leaderboard-v1";
const LS_ACTIVE_GAME = "greed-active-game-v1";

// ---------------- In-memory game state ----------------
let players = [];              // {name, total, last}
let current = 0;
let history = [];              // {player, score, bonus}
let gameRunning = false;
let endMode = false;
let endModeTriggerIdx = -1;
let endTurnsRemaining = [];    // {remaining}
let winnerDeclared = false;
let bannerFlash = null;        // {text, className, expiresAt} — temporary override (bonus celebration, final round announce)
let bannerFlashTimer = null;
let scoreLog = [];             // {text, ts} — human-readable event log (scores, bonuses, passes, undos)

let setupNames = ["", ""];     // setup screen rows
let setupCpu = [false, false]; // parallel to setupNames: is this slot a CPU player?
let gameMode = "dice";         // "dice" | "score"
let session = { unlocked: false };
let adminActiveTab = "players";
let localStats = {};           // fallback cache {name: {biggest,games,comeback,greed,six}}

// =========================================================================
// HYBRID DICE ROLL — generates the suggested score from a real GREED roll.
// Engine adapted from greed-dice-game.html; scoring per GREED-mechanics.md.
// Dice feed the existing addScore() path, so manual entry / quick-adds /
// bonus buttons remain as a fallback.
// =========================================================================
let turnDice = [];      // not-yet-scored dice this turn: {sym,cls,color}
let bankedDice = [];    // flat view of rollGroups (display only)
let rollGroups = [];    // each entry = dice set aside from ONE physical roll; groups never merge across rolls
let turnScore = 0;      // accumulated turn total (not yet committed)
let dicePhase = "idle"; // idle | rolling | select | greedOut
let diceAnimTimer = null;
let diceSpinTimer = null;
let diceWatchdog = null;
let pendingRoll = null;     // {finalDice, fresh} locked-in result awaiting settle

const DICE_SYMS = [
  { sym: "$", cls: "dollar" },
  { sym: "G", cls: "g" },
  { sym: "R", cls: "r" },
  { sym: "E", cls: "e-red", color: "red" },
  { sym: "E", cls: "e-pink", color: "pink" },
  { sym: "D", cls: "d" }
];

function rollDie() {
  const base = DICE_SYMS[Math.floor(Math.random() * DICE_SYMS.length)];
  return { sym: base.sym, cls: base.cls, color: base.color || null };
}

// Score a set of dice -> { score, kept:[indices] }
function evalRoll(dice) {
  // 6 of a kind = 5000 (matches the 6-OF-A-KIND bonus)
  if (dice.length === 6 && new Set(dice.map(d => d.sym)).size === 1) {
    return { score: 5000, kept: [0,1,2,3,4,5] };
  }
  let score = 0;
  const kept = new Set();
  const idx = { "$": [], "G": [], "R": [], "E": [], "D": [] };
  dice.forEach((d, i) => idx[d.sym].push(i));

  // Full set: one of each, two E's different colours
  if (idx["$"].length >= 1 && idx["G"].length >= 1 && idx["R"].length >= 1 &&
      idx["D"].length >= 1 && idx["E"].length >= 2) {
    const eColors = idx["E"].map(i => dice[i].color);
    if (new Set(eColors).size >= 2) {
      score += 1000;
      kept.add(idx["$"][0]); kept.add(idx["G"][0]); kept.add(idx["R"][0]); kept.add(idx["D"][0]);
      const e0 = idx["E"][0];
      const e1 = idx["E"].find(i => dice[i].color !== dice[e0].color);
      kept.add(e0); kept.add(e1);
      return { score, kept: [...kept] };
    }
  }

  // 4 D's (1000) + any extra single D (100 each)
  if (idx["D"].length >= 4) {
    const groups = Math.floor(idx["D"].length / 4);
    score += groups * 1000;
    const rem = idx["D"].length - groups * 4;
    score += rem * 100;
    idx["D"].forEach(i => kept.add(i));
  } else if (idx["D"].length > 0) {
    score += idx["D"].length * 100;
    idx["D"].forEach(i => kept.add(i));
  }

  // 3 $ (600) + any extra single $ (100 each)
  if (idx["$"].length >= 3) {
    score += 600;
    for (let k = 0; k < 3; k++) kept.add(idx["$"][k]);
    for (let k = 3; k < idx["$"].length; k++) { score += 100; kept.add(idx["$"][k]); }
  }
  // 3 G (500) + any extra single G (50 each)
  if (idx["G"].length >= 3) {
    score += 500;
    for (let k = 0; k < 3; k++) kept.add(idx["G"][k]);
    for (let k = 3; k < idx["G"].length; k++) { score += 50; kept.add(idx["G"][k]); }
  } else if (idx["G"].length > 0) { score += idx["G"].length * 50; idx["G"].forEach(i => kept.add(i)); }
  // 3 R (400) + any extra R beyond the trio (50 each). R is NEVER a single.
  if (idx["R"].length >= 3) {
    score += 400;
    for (let k = 0; k < 3; k++) kept.add(idx["R"][k]);
    for (let k = 3; k < idx["R"].length; k++) { score += 50; kept.add(idx["R"][k]); }
  }
  // 3 E same colour (300) + any extra single E of that colour (50 each)
  const eRed = idx["E"].filter(i => dice[i].color === "red");
  const ePink = idx["E"].filter(i => dice[i].color === "pink");
  if (eRed.length >= 3) {
    score += 300;
    for (let k = 0; k < 3; k++) kept.add(eRed[k]);
    for (let k = 3; k < eRed.length; k++) { score += 50; kept.add(eRed[k]); }
  } else if (ePink.length >= 3) {
    score += 300;
    for (let k = 0; k < 3; k++) kept.add(ePink[k]);
    for (let k = 3; k < ePink.length; k++) { score += 50; kept.add(ePink[k]); }
  }

  return { score, kept: [...kept] };
}

function resetDice() {
  clearTimeout(diceAnimTimer);
  diceAnimTimer = null;
  clearTimeout(diceSpinTimer);
  diceSpinTimer = null;
  clearTimeout(diceWatchdog);
  diceWatchdog = null;
  pendingRoll = null;
  turnDice = [];
  bankedDice = [];
  rollGroups = [];
  turnScore = 0;
  dicePhase = "idle";
  const row = document.getElementById("diceRow");
  const bankedRow = document.getElementById("bankedRow");
  const rollBtn = document.getElementById("rollBtn");
  const bankBtn = document.getElementById("bankBtn");
  const hotBtn = document.getElementById("hotBtn");
  const clearBtn = document.getElementById("clearBtn");
  const hint = document.getElementById("diceHint");
  if (row) row.innerHTML = '<div class="dice-prompt">🎲 Tap ROLL to throw the dice</div>';
  if (bankedRow) bankedRow.innerHTML = "";
  if (rollBtn) { rollBtn.classList.remove("hidden"); rollBtn.textContent = "🎲 ROLL"; }
  if (bankBtn) bankBtn.classList.add("hidden");
  if (hotBtn) hotBtn.classList.add("hidden");
  if (clearBtn) clearBtn.classList.add("hidden");
  if (hint) hint.textContent = "";
}

function diceRoll() {
  if (winnerDeclared) return;
  if (dicePhase === "rolling") return; // ignore clicks while a roll is animating (prevents lost timers)
  const fresh = dicePhase === "idle" || dicePhase === "greedOut";
  const canRoll = fresh || dicePhase === "select";
  if (!canRoll) return;

  let count;
  if (fresh) count = 6;
  else if (turnDice.length === 0) count = 6;          // hot dice → reroll all
  else count = turnDice.length;                        // reroll the unselected remainder
  const finalDice = [];
  for (let i = 0; i < count; i++) finalDice.push(rollDie());

  const row = document.getElementById("diceRow");
  row.innerHTML = "";
  const spinEls = [];
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "die rolling";
    el.textContent = DICE_SYMS[0].sym;
    row.appendChild(el);
    spinEls.push(el);
  }
  dicePhase = "rolling";
  document.getElementById("rollBtn").classList.add("hidden");
  document.getElementById("bankBtn").classList.add("hidden");
  document.getElementById("hotBtn").classList.add("hidden");
  document.getElementById("clearBtn").classList.add("hidden");
  document.getElementById("diceHint").textContent = "Rolling…";

  // Lock in the result now so we can settle even if a timer is lost (e.g. tab throttled).
  pendingRoll = { finalDice, fresh };

  // Cycle random faces while tumbling, then land on the real result
  clearTimeout(diceAnimTimer);
  clearTimeout(diceSpinTimer);
  clearTimeout(diceWatchdog);
  let ticks = 0;
  const totalTicks = 10;
  diceSpinTimer = setInterval(() => {
    ticks++;
    spinEls.forEach((el, i) => {
      const r = rollDie();
      el.className = "die " + r.cls + " rolling";
      el.textContent = r.sym;
    });
    if (ticks >= totalTicks) {
      clearInterval(diceSpinTimer);
      diceAnimTimer = setTimeout(() => settleDice(finalDice, fresh), 140);
    }
  }, 70);
  // Safety net: if for any reason the settle timer never fires, force a settle
  // so the tray can never get stuck spinning forever.
  diceWatchdog = setTimeout(() => {
    if (dicePhase === "rolling") settleDice(finalDice, fresh);
  }, 2500);
}

// Score whatever dice you pass (one physical roll's set-aside dice).
function scoreGroup(dice) {
  return evalRoll(dice).score;
}

function recomputeTurnScore() {
  turnScore = rollGroups.reduce((sum, g) => sum + scoreGroup(g), 0);
  bankedDice = rollGroups.flat();
}

function settleDice(finalDice, fresh) {
  clearTimeout(diceWatchdog);
  diceWatchdog = null;
  pendingRoll = null;
  // open a fresh selection group for this physical roll
  rollGroups.push([]);

  // Render the real final faces with a land-pop (replaces the spinning ones)
  const row = document.getElementById("diceRow");
  if (row) {
    row.innerHTML = "";
    finalDice.forEach(d => {
      const el = document.createElement("div");
      el.className = "die " + d.cls + " land";
      el.textContent = d.sym;
      row.appendChild(el);
    });
  }
  document.getElementById("diceHint").textContent = "Rolled!";

  if (evalRoll(finalDice).score === 0) {
    // No scoring option on this throw → GREED OUT.
    // On a reroll this forfeits EVERYTHING set aside earlier this turn.
    // Auto-commit a 0 and pass to the next player.
    rollGroups = [];
    bankedDice = [];
    turnScore = 0;
    turnDice = finalDice;
    dicePhase = "greedOut";
    toast(fresh
      ? "GREED OUT — 0 scored, turn passed"
      : "GREED OUT — all set-aside dice & score lost, turn passed");
    diceAnimTimer = setTimeout(() => {
      cpuThinking = false;
      resetDice();
      handleNoScore(); // commits 0 (end mode) or just advances (normal)
    }, 1500);
    return;
  }

  turnDice = finalDice;
  dicePhase = "select";
  recomputeTurnScore();
  renderDiceControls();
  if (players[current] && players[current].cpu) setTimeout(cpuDecide, 450);
}

function toggleDie(index) {
  if (dicePhase !== "select") return;
  if (index < 0 || index >= turnDice.length) return;
  const d = turnDice.splice(index, 1)[0];
  rollGroups[rollGroups.length - 1].push(d); // current roll's group only
  recomputeTurnScore();
  renderDiceControls();
}

function unselectDie(index) {
  // Only the current roll's picks can be moved back (earlier rolls are locked).
  if (dicePhase !== "select") return;
  const g = rollGroups[rollGroups.length - 1];
  if (index < 0 || index >= g.length) return;
  const d = g.splice(index, 1)[0];
  turnDice.push(d);
  recomputeTurnScore();
  renderDiceControls();
}

function clearSelection() {
  if (dicePhase !== "select") return;
  const g = rollGroups[rollGroups.length - 1];
  turnDice = turnDice.concat(g);
  g.length = 0;
  recomputeTurnScore();
  renderDiceControls();
}

function renderDiceControls() {
  const row = document.getElementById("diceRow");
  const bankedRow = document.getElementById("bankedRow");
  const rollBtn = document.getElementById("rollBtn");
  const bankBtn = document.getElementById("bankBtn");
  const hotBtn = document.getElementById("hotBtn");
  const clearBtn = document.getElementById("clearBtn");
  const hint = document.getElementById("diceHint");
  if (!row || !bankedRow) return;

  if (dicePhase === "rolling") return; // leave tumbling faces up

  if (dicePhase === "idle") {
    row.innerHTML = '<div class="dice-prompt">🎲 Tap ROLL to throw the dice</div>';
    bankedRow.innerHTML = "";
    rollBtn.classList.remove("hidden"); rollBtn.textContent = "🎲 ROLL";
    bankBtn.classList.add("hidden");
    hotBtn.classList.add("hidden");
    clearBtn.classList.add("hidden");
    hint.textContent = "";
    return;
  }

  if (dicePhase === "greedOut") {
    row.innerHTML = turnDice.map(d => `<div class="die ${d.cls}">${d.sym}</div>`).join("");
    bankedRow.innerHTML = "";
    hint.textContent = "GREED OUT — tap “No Score / Pass” to lose the turn";
    rollBtn.classList.add("hidden");
    bankBtn.classList.add("hidden");
    hotBtn.classList.add("hidden");
    clearBtn.classList.add("hidden");
    return;
  }

  // select — player taps dice in the main tray to set them aside
  if (turnDice.length > 0) {
    row.innerHTML = turnDice.map((d, i) =>
      `<div class="die ${d.cls} selectable land" onclick="toggleDie(${i})">${d.sym}</div>`).join("");
  } else {
    row.innerHTML = '<div class="dice-prompt">All dice set aside — reroll!</div>';
  }
  // Side tray: earlier rolls are locked; current roll's picks are tappable to undo
  const lastIdx = rollGroups.length - 1;
  bankedRow.innerHTML = rollGroups.map((g, gi) => g.map((d, k) =>
    gi === lastIdx
      ? `<div class="die ${d.cls} banked" onclick="unselectDie(${k})">${d.sym}</div>`
      : `<div class="die ${d.cls} banked">${d.sym}</div>`).join("")).join("");

  rollBtn.classList.add("hidden");
  bankBtn.classList.remove("hidden");
  bankBtn.disabled = turnScore <= 0;
  bankBtn.textContent = "💰 BANK +" + turnScore;
  // Only allow rerolling when there's already something banked to protect AND
  // the remaining dice actually offer a scoring option. If the tray can't score
  // at all (e.g. 2R + 1$, or any all-non-scoring set), rolling again is just a
  // greed-out gamble that forfeits what's banked — so hide the roll button and
  // force a BANK / PASS decision instead.
  const remainingScore = evalRoll(turnDice).score;
  const canReroll = turnScore > 0 && (turnDice.length === 0 || remainingScore > 0);
  hotBtn.classList.toggle("hidden", !canReroll);
  if (canReroll) {
    hotBtn.textContent = turnDice.length === 0 ? "🎲 HOT DICE (6)" : `🎲 ROLL REMAINING (${turnDice.length})`;
  }
  clearBtn.classList.toggle("hidden", rollGroups[lastIdx].length === 0);
  hint.textContent = turnScore > 0
    ? (canReroll
        ? `Set aside from ${rollGroups.length} roll(s) = +${turnScore} — bank it or roll the rest`
        : `Remaining dice don't score — BANK +${turnScore} or PASS`)
    : "Tap dice to set them aside";
}

function diceBank() {
  if (winnerDeclared) return;
  if (turnScore <= 0) return;
  const s = turnScore;
  resetDice();
  addScore(s); // normal entry: advances turn, triggers end mode, etc.
}

// =========================================================================
// CPU PLAYERS (dice mode only) — full auto turn.
// =========================================================================
let cpuThinking = false;

function maybeRunCpu() {
  if (!gameRunning || winnerDeclared) { cpuThinking = false; return; }
  if (!players[current] || !players[current].cpu) { cpuThinking = false; return; }
  if (gameMode !== "dice") { cpuThinking = false; return; }
  if (cpuThinking) return;
  cpuThinking = true;
  setTimeout(cpuTakeTurn, 650);
}

function cpuTakeTurn() {
  if (!players[current] || !players[current].cpu || winnerDeclared) { cpuThinking = false; return; }
  // Start the roll (animates); cpuDecide() is invoked by settleDice when done.
  toast(players[current].name + " (CPU) is rolling…");
  diceRoll();
}

// Called by settleDice once the dice have landed on a CPU turn.
function cpuDecide() {
  if (dicePhase !== "select" || !players[current] || !players[current].cpu) return;
  const res = evalRoll(turnDice);
  // Bank the maximal scoring set for this roll (evalRoll already picks it).
  const keep = res.kept.slice().sort((a, b) => b - a);
  keep.forEach(idx => toggleDie(idx));

  if (turnDice.length === 0) {
    // All dice scored this roll → reroll hot dice for more.
    setTimeout(() => { if (dicePhase === "select") diceRoll(); }, 380);
    return;
  }
  // Decide: bank or roll the remaining dice.
  const bank = (turnScore >= 1000) || (Math.random() < 0.45);
  if (bank) {
    setTimeout(() => { cpuThinking = false; diceBank(); }, 380);
  } else {
    setTimeout(() => { if (dicePhase === "select") diceRoll(); }, 380);
  }
}

// =========================================================================
// LIVE GAME AUTOSAVE (localStorage) — survives accidental refresh/close.
// Snapshots the full in-memory game state after every mutation; cleared
// once a winner is declared and acknowledged (New Game) or explicitly ended.
// =========================================================================
function saveGameState() {
  if (!gameRunning) return;
  try {
    const snapshot = {
      players, current, history, gameRunning, endMode,
      endModeTriggerIdx, endTurnsRemaining, winnerDeclared, scoreLog,
      gameMode,
      savedAt: Date.now()
    };
    localStorage.setItem(LS_ACTIVE_GAME, JSON.stringify(snapshot));
  } catch (e) { console.warn("saveGameState failed", e); }
}

function loadGameState() {
  try {
    const raw = localStorage.getItem(LS_ACTIVE_GAME);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function clearGameState() {
  localStorage.removeItem(LS_ACTIVE_GAME);
}

function restoreGameState(snapshot) {
  players = snapshot.players;
  current = snapshot.current;
  history = snapshot.history;
  gameRunning = snapshot.gameRunning;
  endMode = snapshot.endMode;
  endModeTriggerIdx = snapshot.endModeTriggerIdx;
  endTurnsRemaining = snapshot.endTurnsRemaining;
  winnerDeclared = snapshot.winnerDeclared;
  scoreLog = snapshot.scoreLog || [];
  gameMode = snapshot.gameMode || "dice";

  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("winnerScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  renderGame();
  toast("Restored your in-progress game");
}

// Checks localStorage for a cached in-progress game on load and, if found,
// shows a resume prompt above the setup screen rather than auto-jumping in
// (so a stale/unwanted cache doesn't silently trap the user).
function checkForCachedGame() {
  const snapshot = loadGameState();
  const panel = document.getElementById("resumePanel");
  if (!snapshot || !snapshot.players || snapshot.players.length === 0 || snapshot.winnerDeclared) {
    panel.classList.add("hidden");
    if (snapshot && snapshot.winnerDeclared) clearGameState(); // finished games shouldn't linger
    return;
  }
  const names = snapshot.players.map(p => p.name).join(", ");
  const turnName = snapshot.players[snapshot.current] ? snapshot.players[snapshot.current].name : "?";
  const savedWhen = snapshot.savedAt ? new Date(snapshot.savedAt).toLocaleTimeString() : "";
  document.getElementById("resumeSummary").textContent =
    `${names} — ${snapshot.history.length} turn${snapshot.history.length === 1 ? "" : "s"} played, ${turnName} was up next${savedWhen ? " (saved " + savedWhen + ")" : ""}`;
  panel.classList.remove("hidden");
}

function resumeCachedGame() {
  const snapshot = loadGameState();
  if (!snapshot) return;
  document.getElementById("resumePanel").classList.add("hidden");
  restoreGameState(snapshot);
}

function discardCachedGame() {
  clearGameState();
  document.getElementById("resumePanel").classList.add("hidden");
}

// =========================================================================
// SUPABASE HELPERS (best-effort, non-blocking)
// =========================================================================
function sbHeaders(extra) {
  return Object.assign({
    "apikey": SB.key,
    "Authorization": "Bearer " + SB.key,
    "Content-Type": "application/json"
  }, extra || {});
}

async function sbGet(table, query) {
  if (!SB) return null;
  try {
    const res = await fetch(`${SB.url}/rest/v1/${table}?${query}`, { headers: sbHeaders() });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { console.warn("sbGet failed", table, e); return null; }
}

async function sbPost(table, body, extraHeaders) {
  if (!SB) return null;
  try {
    const res = await fetch(`${SB.url}/rest/v1/${table}`, {
      method: "POST",
      headers: sbHeaders(Object.assign({ "Prefer": "return=representation" }, extraHeaders || {})),
      body: JSON.stringify(body)
    });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { console.warn("sbPost failed", table, e); return null; }
}

async function sbPatch(table, query, body) {
  if (!SB) return null;
  try {
    const res = await fetch(`${SB.url}/rest/v1/${table}?${query}`, {
      method: "PATCH",
      headers: sbHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify(body)
    });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { console.warn("sbPatch failed", table, e); return null; }
}

async function sbDelete(table, query) {
  if (!SB) return null;
  try {
    const res = await fetch(`${SB.url}/rest/v1/${table}?${query}`, {
      method: "DELETE",
      headers: sbHeaders()
    });
    return res.ok;
  } catch (e) { console.warn("sbDelete failed", table, e); return false; }
}

// =========================================================================
// PERSISTENCE — saved players
// =========================================================================
function getLocalSavedPlayers() {
  try { return JSON.parse(localStorage.getItem(LS_SAVED_PLAYERS) || "[]"); }
  catch (e) { return []; }
}
function setLocalSavedPlayers(arr) {
  localStorage.setItem(LS_SAVED_PLAYERS, JSON.stringify(arr));
}

async function getSavedPlayers() {
  const local = getLocalSavedPlayers();
  if (!SB) return local;
  const cloud = await sbGet("greed_players", "select=name");
  if (!cloud) return local;
  const cloudNames = cloud.map(r => r.name);
  return Array.from(new Set([...local, ...cloudNames]));
}

async function mergeAndSaveNames(newNames) {
  const existing = getLocalSavedPlayers();
  const merged = Array.from(new Set([...existing, ...newNames]));
  setLocalSavedPlayers(merged);
  if (SB) {
    for (const name of newNames) {
      sbPost("greed_players", { name }, { "Prefer": "resolution=ignore-duplicates,return=minimal" });
    }
  }
}

// =========================================================================
// PERSISTENCE — leaderboard
// =========================================================================
function getLocalLeaderboard() {
  try { return JSON.parse(localStorage.getItem(LS_LEADERBOARD) || "[]"); }
  catch (e) { return []; }
}
function setLocalLeaderboard(arr) {
  arr.sort((a, b) => b.wins - a.wins);
  localStorage.setItem(LS_LEADERBOARD, JSON.stringify(arr.slice(0, 50)));
}

async function getLeaderboard() {
  if (SB) {
    const cloud = await sbGet("greed_leaderboard", "select=name,wins&order=wins.desc&limit=20");
    if (cloud) return cloud;
  }
  return getLocalLeaderboard().slice(0, 20);
}

async function recordWin(name) {
  // local
  const local = getLocalLeaderboard();
  const existingLocal = local.find(r => r.name === name);
  if (existingLocal) existingLocal.wins += 1;
  else local.push({ name, wins: 1 });
  setLocalLeaderboard(local);

  // cloud
  if (SB) {
    const existing = await sbGet("greed_leaderboard", `select=name,wins&name=eq.${encodeURIComponent(name)}`);
    if (existing && existing.length > 0) {
      await sbPatch("greed_leaderboard", `name=eq.${encodeURIComponent(name)}`, { wins: existing[0].wins + 1 });
    } else {
      await sbPost("greed_leaderboard", { name, wins: 1 });
    }
  }
}

// =========================================================================
// PERSISTENCE — stats (biggest max, games/greed/six sum, comeback max)
// =========================================================================
async function saveStatCloud(name, patch) {
  // local cache merge
  const cur = localStats[name] || { biggest: 0, games: 0, comeback: 0, greed: 0, six: 0 };
  if (patch.biggest !== undefined) cur.biggest = Math.max(cur.biggest, patch.biggest);
  if (patch.comeback !== undefined) cur.comeback = Math.max(cur.comeback, patch.comeback);
  if (patch.games !== undefined) cur.games = (cur.games || 0) + patch.games;
  if (patch.greed !== undefined) cur.greed = (cur.greed || 0) + patch.greed;
  if (patch.six !== undefined) cur.six = (cur.six || 0) + patch.six;
  localStats[name] = cur;

  if (!SB) return;
  const existing = await sbGet("greed_stats", `select=*&name=eq.${encodeURIComponent(name)}`);
  if (existing && existing.length > 0) {
    const row = existing[0];
    const merged = {
      biggest: Math.max(row.biggest || 0, patch.biggest !== undefined ? patch.biggest : 0),
      comeback: Math.max(row.comeback || 0, patch.comeback !== undefined ? patch.comeback : 0),
      games: (row.games || 0) + (patch.games || 0),
      greed: (row.greed || 0) + (patch.greed || 0),
      six: (row.six || 0) + (patch.six || 0),
    };
    await sbPatch("greed_stats", `name=eq.${encodeURIComponent(name)}`, merged);
  } else {
    await sbPost("greed_stats", {
      name,
      biggest: patch.biggest || 0,
      comeback: patch.comeback || 0,
      games: patch.games || 0,
      greed: patch.greed || 0,
      six: patch.six || 0
    });
  }
}

async function getAllStats() {
  if (SB) {
    const cloud = await sbGet("greed_stats", "select=name,biggest,games,comeback,greed,six");
    if (cloud) {
      const map = {};
      cloud.forEach(r => map[r.name] = r);
      return map;
    }
  }
  return localStats;
}

  setupNames.splice(idx, 1);
  setupCpu.splice(idx, 1);
  renderSetupRows();
}
function updateSetupName(idx, val) {
  setupNames[idx] = val;
}
function updateSetupCpu(idx, checked) {
  setupCpu[idx] = checked;
}

function renderSetupRows() {
  const container = document.getElementById("playerRows");
  container.innerHTML = "";
  setupNames.forEach((name, idx) => {
    const row = document.createElement("div");
    row.className = "setup-row";
    row.innerHTML = `
      <input type="text" placeholder="Player ${idx + 1} name" value="${escapeHtml(name)}"
        oninput="updateSetupName(${idx}, this.value)" maxlength="24">
      <label class="row-cpu" title="CPU auto-plays this seat (dice mode)">
        <input type="checkbox" ${setupCpu[idx] ? "checked" : ""} onchange="updateSetupCpu(${idx}, this.checked)">
        <span>CPU</span>
      </label>
      <button class="row-remove" ${setupNames.length <= 2 ? "disabled" : ""} onclick="removePlayerRow(${idx})">−</button>
    `;
    container.appendChild(row);
  });
  document.getElementById("addRowBtn").disabled = setupNames.length >= 6;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function renderSavedChips() {
  const chipsEl = document.getElementById("savedChips");
  const saved = await getSavedPlayers();
  document.getElementById("setupSyncDot").className = "sync-dot " + (SB ? "on" : "off");
  chipsEl.innerHTML = "";
  if (saved.length === 0) {
    chipsEl.innerHTML = `<span style="font-size:12px; color:var(--text-dim);">No saved players yet</span>`;
    return;
  }
  saved.sort((a, b) => a.localeCompare(b)).forEach(name => {
    const already = setupNames.includes(name);
    const chip = document.createElement("button");
    chip.className = "chip" + (already ? " added" : "");
    chip.textContent = already ? "✓ " + name : name;
    chip.onclick = () => {
      if (setupNames.includes(name)) return;
      const emptyIdx = setupNames.findIndex(n => n.trim() === "");
      if (emptyIdx !== -1) setupNames[emptyIdx] = name;
      else if (setupNames.length < 6) setupNames.push(name);
      else { toast("Max 6 players"); return; }
      renderSetupRows();
      renderSavedChips();
    };
    chipsEl.appendChild(chip);
  });
}

async function renderLeaderboardUI() {
  const lb = await getLeaderboard();
  const el = document.getElementById("leaderboardList");
  if (lb.length === 0) {
    el.innerHTML = `<div style="text-align:center; font-size:13px; color:var(--text-dim);">No games recorded yet</div>`;
    return;
  }
  el.innerHTML = lb.map((r, i) => `
    <div class="lb-row">
      <div class="lb-rank">#${i + 1}</div>
      <div class="lb-name">${escapeHtml(r.name)}</div>
      <div class="lb-wins">${r.wins} 🏆</div>
    </div>
  `).join("");
}

async function startGame(mode) {
  gameMode = (mode === "score") ? "score" : "dice";
  const errEl = document.getElementById("setupError");
  errEl.textContent = "";
  const names = setupNames.map((n, i) => {
    const base = n.trim();
    if (base.length > 0) return base;
    return setupCpu[i] ? "CPU " + (i + 1) : "Player " + (i + 1);
  }).filter(Boolean);

  if (names.length < 2) { errEl.textContent = "Enter at least 2 player names"; return; }
  if (names.length > 6) { errEl.textContent = "Max 6 players"; return; }

  players = names.map((n, i) => ({ name: n, total: 0, last: null, cpu: !!setupCpu[i] }));
  current = 0;
  history = [];
  gameRunning = true;
  endMode = false;
  endModeTriggerIdx = -1;
  endTurnsRemaining = players.map(() => ({ remaining: 0 }));
  winnerDeclared = false;
  scoreLog = [];

  await mergeAndSaveNames(names);

  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("winnerScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  document.getElementById("resumePanel").classList.add("hidden");

  saveGameState();
  renderGame();
  maybeRunCpu();
}

// =========================================================================
// GAME LOGIC
// =========================================================================
function findHighestScorer() {
  let best = 0;
  for (let i = 1; i < players.length; i++) {
    if (players[i].total > players[best].total) best = i;
  }
  return best;
}

function cardClasses(i) {
  const classes = [];
  const highest = findHighestScorer();
  if (winnerDeclared) {
    classes.push(i === highest ? "leader" : "eliminated");
    return classes;
  }
  if (!endMode) {
    if (i === current) classes.push("active");
    return classes;
  }
  // endMode
  if (i === highest) classes.push("leader");
  if (i === current) classes.push("active");
  if (endTurnsRemaining[i] && endTurnsRemaining[i].remaining === 0) classes.push("eliminated");
  return classes;
}

async function addScore(rawScore, bonus) {
  if (winnerDeclared) return;
  let score = Math.max(0, parseInt(rawScore) || 0);
  const i = current;
  const name = players[i].name;

  players[i].last = score;
  players[i].total += score;

  if (score > 0) saveStatCloud(name, { biggest: score });
  if (bonus === "greed") saveStatCloud(name, { greed: 1 });
  if (bonus === "six") saveStatCloud(name, { six: 1 });

  history.push({ player: name, score, bonus });

  const bonusLabel = bonus === "greed" ? " ($GREED)" : bonus === "six" ? " (6 OF A KIND)" : "";
  logEvent(`${name}: +${score}${bonusLabel}`);

  // Cheerful flash for bonus plays — stays visible until the turn advances
  // (no timeout), shown even if this turn also triggers final round since
  // the bonus is the more immediate, celebratory event.
  if (bonus === "greed") {
    setBannerFlashPersistent(`💲 ${name.toUpperCase()} CALLED $GREED! +1000`, "bonus-flash");
  } else if (bonus === "six") {
    setBannerFlashPersistent(`6️⃣ ${name.toUpperCase()} ROLLED SIX OF A KIND! +5000`, "bonus-flash");
  }

  // Trigger end mode
  if (!endMode && players[i].total >= 5000) {
    endMode = true;
    endModeTriggerIdx = i;
    endTurnsRemaining = players.map((_, idx) => ({ remaining: idx === i ? 0 : 1 }));
    if (!bonus) {
      setBannerFlash("WE HAVE ENTERED THE FINAL ROUND", "final-round", 3500);
    }
  } else if (endMode && !bonus) {
    // End-mode completion path (only for non-bonus entries)
    if (endTurnsRemaining[i]) {
      endTurnsRemaining[i].remaining = Math.max(0, endTurnsRemaining[i].remaining - 1);
    }
    const allDone = endTurnsRemaining.every(t => t.remaining === 0);
    if (allDone) {
      await declareWinner();
      saveGameState();
      renderGame();
      return;
    }
  }

  if (!bonus) {
    advance();
  }
  saveGameState();
  renderGame();
}

function advance() {
  // Clear any persistent bonus-celebration flash — it stays up until the
  // turn moves on, per spec (no auto-timeout for $GREED / 6-of-a-kind).
  if (bannerFlash && bannerFlash.persistent) {
    bannerFlash = null;
  }
  const n = players.length;
  let next = (current + 1) % n;
  let tries = 0;
  while (tries < n) {
    if (!endMode || (endTurnsRemaining[next] && endTurnsRemaining[next].remaining > 0)) break;
    next = (next + 1) % n;
    tries++;
  }
  current = next;
}

async function declareWinner() {
  const topScore = Math.max(...players.map(p => p.total));
  const winners = players.filter(p => p.total === topScore);

  // Virtual dice games are friendly only — they never touch the leaderboard or stats.
  if (gameMode === "dice") {
    winnerDeclared = true;
    return;
  }

  // games +1 for everyone
  for (const p of players) {
    saveStatCloud(p.name, { games: 1 });
  }

  // comeback stat
  players.forEach((p, idx) => {
    if (winners.includes(p) && idx !== endModeTriggerIdx && p.last > 0) {
      saveStatCloud(p.name, { comeback: p.last });
    }
  });

  if (winners.length === 1) {
    await recordWin(winners[0].name);
  }

  winnerDeclared = true;
}

function handleBonus(type) {
  if (winnerDeclared) return;
  const score = type === "greed" ? 1000 : 5000;
  addScore(score, type);
}

function submitManualScore() {
  if (winnerDeclared) return;
  const input = document.getElementById("manualScoreInput");
  const val = input.value;
  input.value = "";
  addScore(val, undefined);
}

function handleNoScore() {
  if (winnerDeclared) return;
  if (!endMode) {
    const name = players[current].name;
    logEvent(`${name}: passed (no score)`);
    advance();
    saveGameState();
    renderGame();
  } else {
    addScore(0, undefined);
  }
}

function undo() {
  if (history.length === 0) return;
  bannerFlash = null;
  clearTimeout(bannerFlashTimer);
  const last = history.pop();
  const pid = players.findIndex(p => p.name === last.player);
  if (pid === -1) return;

  if (endMode && endTurnsRemaining[pid]) {
    endTurnsRemaining[pid].remaining += 1;
  }
  players[pid].total -= last.score;
  players[pid].last = null;

  if (endMode) {
    const anyHigh = players.some((p, idx) => p.total >= 5000 && endTurnsRemaining[idx] && endTurnsRemaining[idx].remaining > 0);
    if (!anyHigh) {
      endMode = false;
      endModeTriggerIdx = -1;
      endTurnsRemaining = players.map(() => ({ remaining: 0 }));
    }
  }

  winnerDeclared = false;
  current = pid;

  const bonusLabel = last.bonus === "greed" ? " ($GREED)" : last.bonus === "six" ? " (6 OF A KIND)" : "";
  logEvent(`↩ UNDO: reverted ${last.player}'s +${last.score}${bonusLabel}`);

  saveGameState();
  renderGame();
}

function confirmNewGame() {
  if (confirm("End this game and return to setup? Progress will be lost.")) {
    newGame();
  }
}

function newGame() {
  bannerFlash = null;
  clearTimeout(bannerFlashTimer);
  clearGameState();
  players = [];
  current = 0;
  history = [];
  gameRunning = false;
  endMode = false;
  endModeTriggerIdx = -1;
  endTurnsRemaining = [];
  winnerDeclared = false;
  scoreLog = [];
  setupNames = ["", ""];
  setupCpu = [false, false];

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("winnerScreen").classList.add("hidden");
  document.getElementById("setupScreen").classList.remove("hidden");
  renderSetup();
}

// =========================================================================
// RENDER
// =========================================================================
function renderQuickGrid() {
  const grid = document.getElementById("quickGrid");
  grid.innerHTML = QUICK_ADDS.map(v =>
    `<button class="quick-btn" onclick="addScore(${v})">+${v}</button>`
  ).join("");
}

function setBannerFlash(text, className, durationMs) {
  bannerFlash = { text, className, expiresAt: Date.now() + durationMs, persistent: false };
  clearTimeout(bannerFlashTimer);
  bannerFlashTimer = setTimeout(() => {
    bannerFlash = null;
    bannerState();
  }, durationMs);
}

// Bonus flashes (per your request) don't time out on their own — they stay
// visible until the turn actually advances (advance() clears them).
function setBannerFlashPersistent(text, className) {
  clearTimeout(bannerFlashTimer);
  bannerFlash = { text, className, expiresAt: Infinity, persistent: true };
}

// Appends a human-readable entry to the (hidden by default) score history log.
function logEvent(text) {
  scoreLog.push({ text, ts: Date.now() });
}

function bannerState() {
  const bannerEl = document.getElementById("banner");
  const statsEl = document.getElementById("bannerStats");
  statsEl.innerHTML = "";

  if (winnerDeclared) {
    bannerFlash = null;
    clearTimeout(bannerFlashTimer);
    const topScore = Math.max(...players.map(p => p.total));
    const winners = players.filter(p => p.total === topScore);
    if (winners.length > 1) {
      bannerEl.className = "banner tie";
      bannerEl.textContent = "TIE";
    } else {
      bannerEl.className = "banner winner";
      bannerEl.textContent = `WINNER: ${winners[0].name}`;
    }
    return;
  }

  // An active temporary flash (bonus celebration, final-round announce) overrides everything
  if (bannerFlash && bannerFlash.expiresAt > Date.now()) {
    bannerEl.className = "banner " + bannerFlash.className;
    bannerEl.innerHTML = bannerFlash.text;
    return;
  }

  const info = getGameInfoText();

  if (endMode) {
    bannerEl.className = "banner end-times";
    bannerEl.innerHTML = info || "WE ARE IN THE END TIMES";
    return;
  }

  bannerEl.className = "banner first-to";
  bannerEl.innerHTML = info || "FIRST TO 5000";
}

// Computes the current zero-score streak for a player by walking their
// history entries from most recent backward, stopping at the first
// non-zero score (or start of history).
function currentZeroStreak(name) {
  let streak = 0;
  for (let i = history.length - 1; i >= 0; i--) {
    const h = history[i];
    if (h.player !== name) continue;
    if (h.score === 0) { streak++; }
    else break;
  }
  return streak;
}

// Builds the live game-info string that overrides the static banner text
// (FIRST TO 5000 / WE ARE IN THE END TIMES) once there's something to say.
// Prioritizes the most notable fact: an active zero-streak (2+) beats
// leader-margin, since a streak is the more "in the moment" event.
function getGameInfoText() {
  if (players.length === 0) return "";

  const streaks = players
    .map(p => ({ name: p.name, streak: currentZeroStreak(p.name) }))
    .filter(s => s.streak >= 2)
    .sort((a, b) => b.streak - a.streak);
  if (streaks.length > 0) {
    const s = streaks[0];
    return `<span class="stat-cold">${escapeHtml(s.name)}</span> HAS ROLLED ZERO ${s.streak} TIMES IN A ROW`;
  }

  const sorted = [...players].sort((a, b) => b.total - a.total);
  if (sorted[0].total > 0 && players.length > 1) {
    const leader = sorted[0];
    const runnerUp = sorted[1];
    if (leader.total > runnerUp.total) {
      const margin = leader.total - runnerUp.total;
      return `<span class="stat-hot">${escapeHtml(leader.name)}</span> IS LEADING BY ${margin} PT${margin === 1 ? "" : "S"}`;
    } else if (leader.total === runnerUp.total) {
      const tiedNames = sorted.filter(p => p.total === leader.total).map(p => p.name);
      return `${tiedNames.map(escapeHtml).join(" & ")} TIED FOR THE LEAD`;
    }
  }

  return "";
}

// Counts this-game $GREED and 6-of-a-kind hits per player from history
// (live, in-memory — distinct from the cross-game cloud/local stats).
function gameAchievements(name) {
  let greed = 0, six = 0;
  for (const h of history) {
    if (h.player !== name) continue;
    if (h.bonus === "greed") greed++;
    else if (h.bonus === "six") six++;
  }
  return { greed, six };
}

function renderPlayerCards(targetGridId) {
  const grid = document.getElementById(targetGridId);
  const highest = findHighestScorer();
  const leaderTotal = players[highest] ? players[highest].total : 0;

  grid.innerHTML = players.map((p, i) => {
    const classes = cardClasses(i).join(" ");
    let badge = "";
    if (winnerDeclared) {
      if (i === highest) badge = `<div class="badge leader-badge">🏆 Winner</div>`;
    } else if (!endMode && i === current) {
      badge = `<div class="badge your-turn">Your Turn</div>`;
    } else if (endMode) {
      if (i === highest) badge = `<div class="badge leader-badge">Leader</div>`;
      if (endTurnsRemaining[i] && endTurnsRemaining[i].remaining === 0 && i !== highest) badge = `<div class="badge out-badge">Out</div>`;
    }
    const needsHtml = (endMode && !winnerDeclared && i !== highest && (leaderTotal - p.total) > 0)
      ? `<div class="p-needs">needs ${leaderTotal - p.total}</div>` : "";
    const lastHtml = p.last !== null ? `<div class="p-last">last: +${p.last}</div>` : `<div class="p-last">&nbsp;</div>`;

    const achv = gameAchievements(p.name);
    const achvPills = [];
    if (achv.greed > 0) achvPills.push(`<span class="achv-pill greed">💲${achv.greed}</span>`);
    if (achv.six > 0) achvPills.push(`<span class="achv-pill six">6️⃣${achv.six}</span>`);
    const achvHtml = achvPills.length > 0 ? `<div class="p-achievements">${achvPills.join("")}</div>` : "";

    return `
      <div class="p-card ${classes} ${winnerDeclared && i === highest ? "winner-card" : ""}">
        ${badge}
        <div class="p-name">${escapeHtml(p.name)}${p.cpu ? '<span class="cpu-tag">🤖</span>' : ''}</div>
        <div class="p-total">${p.total}</div>
        ${lastHtml}
        ${needsHtml}
        ${achvHtml}
      </div>
    `;
  }).join("");
}

function renderGame() {
  resetDice();
  bannerState();
  renderPlayerCards("cardsGrid");
  renderQuickGrid();
  renderHistoryLog();

  const entryPanel = document.getElementById("entryPanel");
  const diceTray = document.querySelector(".dice-tray");
  const manualEntry = document.querySelector(".manual-entry");
  const quickGrid = document.getElementById("quickGrid");
  const bonusGrid = document.querySelector(".bonus-grid");
  if (winnerDeclared) {
    entryPanel.classList.add("hidden");
    showWinnerScreen();
  } else {
    entryPanel.classList.remove("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    document.getElementById("winnerScreen").classList.add("hidden");
    // Mode separation: dice mode hides manual score entry; score mode hides the dice tray.
    if (gameMode === "score") {
      if (diceTray) diceTray.classList.add("hidden");
      if (manualEntry) manualEntry.classList.remove("hidden");
      if (quickGrid) quickGrid.classList.remove("hidden");
      if (bonusGrid) bonusGrid.classList.remove("hidden");
    } else {
      if (diceTray) diceTray.classList.remove("hidden");
      if (manualEntry) manualEntry.classList.add("hidden");
      if (quickGrid) quickGrid.classList.add("hidden");
      if (bonusGrid) bonusGrid.classList.add("hidden");
    }
  }
  maybeRunCpu();
}

function toggleHistoryPanel() {
  document.getElementById("historyPanel").classList.toggle("hidden");
}

function renderHistoryLog() {
  const el = document.getElementById("historyLogList");
  if (!el) return;
  if (scoreLog.length === 0) {
    el.innerHTML = `<div class="history-empty">No turns logged yet</div>`;
    return;
  }
  el.innerHTML = scoreLog.map(entry => {
    const isUndo = entry.text.startsWith("↩");
    const time = new Date(entry.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    return `
      <div class="history-row ${isUndo ? "is-undo" : ""}">
        <span class="h-text">${escapeHtml(entry.text)}</span>
        <span class="h-time">${time}</span>
      </div>
    `;
  }).join("");
}

function showWinnerScreen() {
  const topScore = Math.max(...players.map(p => p.total));
  const winners = players.filter(p => p.total === topScore);

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("winnerScreen").classList.remove("hidden");

  if (winners.length > 1) {
    document.getElementById("trophyEmoji").textContent = "🤝";
    document.getElementById("winnerNameDisplay").textContent = "TIE";
    document.getElementById("winnerTotalDisplay").textContent = `${winners.map(w => w.name).join(" & ")} — ${topScore} pts`;
  } else {
    document.getElementById("trophyEmoji").textContent = "🏆";
    document.getElementById("winnerNameDisplay").textContent = winners[0].name;
    document.getElementById("winnerTotalDisplay").textContent = `${topScore} points`;
  }
  renderPlayerCards("finalCardsGrid");
  renderLeaderboardUI();
}

function renderSetup() {
  renderSetupRows();
  renderSavedChips();
  renderLeaderboardUI();
  checkForCachedGame();
}

function openAdmin() {

  if (session.unlocked) {
    showAdminPanel();
  } else {
    document.getElementById("adminLoginView").classList.remove("hidden");
    document.getElementById("adminPanelView").classList.add("hidden");
    document.getElementById("adminPwInput").value = "";
    document.getElementById("adminPwError").textContent = "";
  }
}
function closeAdmin() {
  document.getElementById("adminOverlay").classList.add("hidden");
  if (!session.unlocked) return; // re-lock happens naturally since unlocked persists only if true
}
function tryAdminUnlock() {
  const val = document.getElementById("adminPwInput").value;
  if (val === ADMIN_PASSWORD) {
    session.unlocked = true;
    showAdminPanel();
  } else {
    document.getElementById("adminPwError").textContent = "Incorrect password";
  }
}
function showAdminPanel() {
  document.getElementById("adminLoginView").classList.add("hidden");
  document.getElementById("adminPanelView").classList.remove("hidden");
  document.getElementById("adminSyncStatus").innerHTML =
    `<span class="sync-dot ${SB ? "on" : "off"}"></span>${SB ? "Cloud sync active" : "Local only (no cloud configured)"}`;
  switchAdminTab(adminActiveTab);
}
function switchAdminTab(tab) {
  adminActiveTab = tab;
  ["players", "wins", "stats"].forEach(t => {
    document.getElementById(`tabBtn-${t}`).classList.toggle("active", t === tab);
    document.getElementById(`adminTab-${t}`).classList.toggle("hidden", t !== tab);
  });
  if (tab === "players") renderAdminPlayers();
  if (tab === "wins") renderAdminWins();
  if (tab === "stats") renderAdminStats();
}

async function renderAdminPlayers() {
  const saved = await getSavedPlayers();
  const el = document.getElementById("adminPlayersList");
  if (saved.length === 0) {
    el.innerHTML = `<div style="text-align:center; color:var(--text-dim); font-size:13px;">No players saved</div>`;
    return;
  }
  el.innerHTML = saved.sort((a, b) => a.localeCompare(b)).map(name => `
    <div class="admin-row">
      <input type="text" class="rename-input" style="width:110px;" value="${escapeHtml(name)}" data-orig="${escapeHtml(name)}">
      <button class="admin-mini-btn btn-cyan" onclick="adminRenamePlayer('${escapeAttr(name)}', this)">Rename</button>
      <button class="admin-mini-btn btn-pink" onclick="adminDeletePlayer('${escapeAttr(name)}')">Delete</button>
    </div>
  `).join("");
}

function escapeAttr(str) {
  return str.replace(/'/g, "\\'");
}

async function adminAddPlayer() {
  const input = document.getElementById("newAdminName");
  const name = input.value.trim();
  if (!name) return;
  await mergeAndSaveNames([name]);
  input.value = "";
  toast(`Added ${name}`);
  renderAdminPlayers();
}

async function adminRenamePlayer(oldName, btnEl) {
  const row = btnEl.closest(".admin-row");
  const newName = row.querySelector(".rename-input").value.trim();
  if (!newName || newName === oldName) return;
  if (!confirm(`Rename "${oldName}" to "${newName}"? Their stats and wins will transfer.`)) return;

  // add new name
  await mergeAndSaveNames([newName]);

  // transfer leaderboard wins
  if (SB) {
    const lbRows = await sbGet("greed_leaderboard", `select=*&name=eq.${encodeURIComponent(oldName)}`);
    if (lbRows && lbRows.length > 0) {
      const existingNew = await sbGet("greed_leaderboard", `select=*&name=eq.${encodeURIComponent(newName)}`);
      const newWins = (existingNew && existingNew.length > 0 ? existingNew[0].wins : 0) + lbRows[0].wins;
      if (existingNew && existingNew.length > 0) {
        await sbPatch("greed_leaderboard", `name=eq.${encodeURIComponent(newName)}`, { wins: newWins });
      } else {
        await sbPost("greed_leaderboard", { name: newName, wins: newWins });
      }
      await sbDelete("greed_leaderboard", `name=eq.${encodeURIComponent(oldName)}`);
    }
    // transfer stats
    const statRows = await sbGet("greed_stats", `select=*&name=eq.${encodeURIComponent(oldName)}`);
    if (statRows && statRows.length > 0) {
      const s = statRows[0];
      const existingNewStat = await sbGet("greed_stats", `select=*&name=eq.${encodeURIComponent(newName)}`);
      const merged = existingNewStat && existingNewStat.length > 0 ? {
        biggest: Math.max(existingNewStat[0].biggest || 0, s.biggest || 0),
        comeback: Math.max(existingNewStat[0].comeback || 0, s.comeback || 0),
        games: (existingNewStat[0].games || 0) + (s.games || 0),
        greed: (existingNewStat[0].greed || 0) + (s.greed || 0),
        six: (existingNewStat[0].six || 0) + (s.six || 0),
      } : { biggest: s.biggest, comeback: s.comeback, games: s.games, greed: s.greed, six: s.six };

      if (existingNewStat && existingNewStat.length > 0) {
        await sbPatch("greed_stats", `name=eq.${encodeURIComponent(newName)}`, merged);
      } else {
        await sbPost("greed_stats", Object.assign({ name: newName }, merged));
      }
      await sbDelete("greed_stats", `name=eq.${encodeURIComponent(oldName)}`);
    }
    await sbDelete("greed_players", `name=eq.${encodeURIComponent(oldName)}`);
  }

  // local cascade
  let localSaved = getLocalSavedPlayers().filter(n => n !== oldName);
  if (!localSaved.includes(newName)) localSaved.push(newName);
  setLocalSavedPlayers(localSaved);

  let localLb = getLocalLeaderboard();
  const oldLb = localLb.find(r => r.name === oldName);
  if (oldLb) {
    const newLb = localLb.find(r => r.name === newName);
    if (newLb) newLb.wins += oldLb.wins;
    else localLb.push({ name: newName, wins: oldLb.wins });
    localLb = localLb.filter(r => r.name !== oldName);
    setLocalLeaderboard(localLb);
  }
  if (localStats[oldName]) {
    localStats[newName] = localStats[newName] || { biggest: 0, games: 0, comeback: 0, greed: 0, six: 0 };
    const os = localStats[oldName];
    localStats[newName].biggest = Math.max(localStats[newName].biggest, os.biggest || 0);
    localStats[newName].comeback = Math.max(localStats[newName].comeback, os.comeback || 0);
    localStats[newName].games += os.games || 0;
    localStats[newName].greed += os.greed || 0;
    localStats[newName].six += os.six || 0;
    delete localStats[oldName];
  }

  toast(`Renamed to ${newName}`);
  renderAdminPlayers();
}

async function adminDeletePlayer(name) {
  if (!confirm(`Delete "${name}"? This removes their saved name, wins, and stats.`)) return;
  setLocalSavedPlayers(getLocalSavedPlayers().filter(n => n !== name));
  setLocalLeaderboard(getLocalLeaderboard().filter(r => r.name !== name));
  delete localStats[name];
  if (SB) {
    await sbDelete("greed_players", `name=eq.${encodeURIComponent(name)}`);
    await sbDelete("greed_leaderboard", `name=eq.${encodeURIComponent(name)}`);
    await sbDelete("greed_stats", `name=eq.${encodeURIComponent(name)}`);
  }
  toast(`Deleted ${name}`);
  renderAdminPlayers();
}

async function renderAdminWins() {
  const saved = await getSavedPlayers();
  const lb = await getLeaderboard();
  const winsMap = {};
  lb.forEach(r => winsMap[r.name] = r.wins);
  const el = document.getElementById("adminWinsList");
  if (saved.length === 0) {
    el.innerHTML = `<div style="text-align:center; color:var(--text-dim); font-size:13px;">No players saved</div>`;
    return;
  }
  el.innerHTML = saved.sort((a, b) => a.localeCompare(b)).map(name => `
    <div class="admin-row">
      <div class="aname">${escapeHtml(name)}</div>
      <input type="number" class="win-input" value="${winsMap[name] || 0}" min="0">
      <button class="admin-mini-btn btn-cyan" onclick="adminSaveWins('${escapeAttr(name)}', this)">Save</button>
      <button class="admin-mini-btn btn-pink" onclick="adminDeleteWins('${escapeAttr(name)}')">Del</button>
    </div>
  `).join("");
}

async function adminSaveWins(name, btnEl) {
  const row = btnEl.closest(".admin-row");
  const wins = Math.max(0, parseInt(row.querySelector(".win-input").value) || 0);

  let local = getLocalLeaderboard();
  const existingLocal = local.find(r => r.name === name);
  if (existingLocal) existingLocal.wins = wins;
  else local.push({ name, wins });
  setLocalLeaderboard(local);

  if (SB) {
    const existing = await sbGet("greed_leaderboard", `select=name&name=eq.${encodeURIComponent(name)}`);
    if (existing && existing.length > 0) {
      await sbPatch("greed_leaderboard", `name=eq.${encodeURIComponent(name)}`, { wins });
    } else {
      await sbPost("greed_leaderboard", { name, wins });
    }
  }
  toast(`Saved wins for ${name}`);
}

async function adminDeleteWins(name) {
  setLocalLeaderboard(getLocalLeaderboard().filter(r => r.name !== name));
  if (SB) await sbDelete("greed_leaderboard", `name=eq.${encodeURIComponent(name)}`);
  toast(`Removed ${name} from leaderboard`);
  renderAdminWins();
}

async function renderAdminStats() {
  const saved = await getSavedPlayers();
  const stats = await getAllStats();
  const el = document.getElementById("adminStatsList");
  if (saved.length === 0) {
    el.innerHTML = `<div style="text-align:center; color:var(--text-dim); font-size:13px;">No players saved</div>`;
    return;
  }
  el.innerHTML = saved.sort((a, b) => a.localeCompare(b)).map(name => {
    const s = stats[name] || { biggest: 0, games: 0, comeback: 0, greed: 0, six: 0 };
    return `
      <div class="admin-row">
        <div class="aname" style="flex:0 0 70px;">${escapeHtml(name)}</div>
        <input type="number" class="stat-input" data-field="biggest" value="${s.biggest || 0}">
        <input type="number" class="stat-input" data-field="games" value="${s.games || 0}">
        <input type="number" class="stat-input" data-field="comeback" value="${s.comeback || 0}">
        <input type="number" class="stat-input" data-field="greed" value="${s.greed || 0}">
        <input type="number" class="stat-input" data-field="six" value="${s.six || 0}">
        <button class="admin-mini-btn btn-cyan" onclick="adminSaveStats('${escapeAttr(name)}', this)">Save</button>
        <button class="admin-mini-btn btn-pink" onclick="adminDeleteStats('${escapeAttr(name)}')">Del</button>
      </div>
    `;
  }).join("");
}

async function adminSaveStats(name, btnEl) {
  const row = btnEl.closest(".admin-row");
  const inputs = row.querySelectorAll(".stat-input");
  const patch = {};
  inputs.forEach(inp => { patch[inp.dataset.field] = Math.max(0, parseInt(inp.value) || 0); });

  localStats[name] = patch;
  if (SB) {
    const existing = await sbGet("greed_stats", `select=name&name=eq.${encodeURIComponent(name)}`);
    if (existing && existing.length > 0) {
      await sbPatch("greed_stats", `name=eq.${encodeURIComponent(name)}`, patch);
    } else {
      await sbPost("greed_stats", Object.assign({ name }, patch));
    }
  }
  toast(`Saved stats for ${name}`);
}

async function adminDeleteStats(name) {
  delete localStats[name];
  if (SB) await sbDelete("greed_stats", `name=eq.${encodeURIComponent(name)}`);
  toast(`Cleared stats for ${name}`);
  renderAdminStats();
}
