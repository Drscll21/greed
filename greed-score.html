<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>$GREED — Scoreboard</title>
<meta name="theme-color" content="#140c09">
<style>
  :root{
    --ink-900:#0a0604; --ink-800:#150c07; --ink-700:#241209; --ink-600:#3a2418;
    --ember:#d9724a; --amber:#e8935a; --teal:#2a9d8f; --rank:#8fae5c;
    --text:#f7ede4; --dim:#bda390;
    --t-xs:10px; --t-sm:12px; --t-md:14px; --t-lg:17px; --t-xl:22px;
    --r-sm:8px; --r-md:14px; --r-lg:20px;
    --ease-out:cubic-bezier(.2,.8,.2,1);
    --hairline:1px solid rgba(232,147,90,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100dvh;color:var(--text);overflow-y:auto;padding:22px 16px 44px;
    background:
      radial-gradient(circle at 15% 0%, rgba(217,114,74,.20), transparent 46%),
      radial-gradient(circle at 85% 100%, rgba(42,157,143,.16), transparent 46%),
      linear-gradient(160deg,#1a0f09,#0a0604);
  }
  .room{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .room::after{content:'';position:absolute;inset:0;background:radial-gradient(125% 95% at 50% 38%,transparent 42%,rgba(0,0,0,.66) 100%)}
  .glow{position:absolute;border-radius:50%;will-change:transform}
  .g-a{width:70vw;height:70vw;left:-20vw;top:-24vw;opacity:.4;background:radial-gradient(circle,rgba(217,114,74,.42),transparent 66%);animation:driftA 28s ease-in-out infinite}
  .g-b{width:62vw;height:62vw;right:-22vw;bottom:-22vw;opacity:.34;background:radial-gradient(circle,rgba(42,157,143,.4),transparent 66%);animation:driftB 36s ease-in-out infinite}
  @keyframes driftA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.14)}}
  @keyframes driftB{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-5vw,-6vh,0) scale(1)}}
  #app{max-width:1080px;margin:0 auto;position:relative;z-index:1}

  .header{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px;text-align:center}
  .brand-row{display:inline-flex;align-items:center;gap:10px}
  .crest{height:clamp(32px,6.5vw,44px);width:auto;display:block;transform:translateY(2px) rotate(-4deg);
    filter:drop-shadow(0 3px 9px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(232,147,90,.25));
    animation:crestSway 5s var(--ease-out) infinite}
  @keyframes crestSway{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(0) rotate(-1deg)}}
  .wordmark{position:relative;display:inline-flex;align-items:baseline;font-size:clamp(28px,7.5vw,44px);
    font-weight:900;letter-spacing:-1.5px;line-height:.92;text-transform:uppercase;transform:skewX(-7deg)}
  .wordmark::before{content:'$GREED';position:absolute;left:0;top:0;z-index:-1;color:rgba(255,80,30,.30);filter:blur(7px);transform:translate(2px,3px)}
  .wm-dollar{color:#ff6a33;margin-right:1px;text-shadow:0 0 10px rgba(255,106,51,.9),0 0 26px rgba(255,90,43,.6);
    transform:translateY(-.04em) scale(1.13);transform-origin:50% 80%}
  .wm-word{background:linear-gradient(180deg,#fff8ec 0%,#ffd08c 26%,#e8622a 58%,#8f2408 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(90,22,6,.95)) drop-shadow(0 8px 18px rgba(255,90,43,.4))}
  h1{font-size:var(--t-sm);letter-spacing:3px;text-transform:uppercase;color:var(--dim);font-weight:700;line-height:1.5}

  .row{display:flex;gap:14px;margin-bottom:14px;align-items:stretch}
  .panel{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(36,18,9,.86),rgba(16,9,5,.92));
    border:var(--hairline);border-radius:var(--r-lg);padding:18px;
    box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,190,.06)}
  .field-label{display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
  .field-label:first-of-type{margin-top:0}
  .watermark{position:absolute;right:-24px;bottom:-30px;width:180px;height:auto;color:var(--amber);opacity:.055;pointer-events:none}
  .panel-mark{width:60px;height:auto;align-self:center;margin-top:auto;padding-top:14px;color:var(--amber);opacity:.15;pointer-events:none}

  #setup{flex:1}
  .player-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .player-row{display:flex;gap:8px;align-items:center}
  .player-row input{flex:1;padding:11px 13px;border-radius:var(--r-sm);border:1px solid rgba(232,147,90,.22);
    background:#120a06;color:var(--text);font-size:var(--t-lg);font-family:inherit}
  .player-row input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,157,143,.16)}
  .player-row .del-player{background:linear-gradient(180deg,#8b2a20,#5c1a12);color:#ffe9e0;border:1px solid rgba(255,120,90,.28);
    border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;font-size:var(--t-md);font-weight:900}
  .player-row .del-player:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}

  button{cursor:pointer;border:none;border-radius:var(--r-md);padding:12px 18px;font-size:var(--t-md);
    font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;
    transition:transform .1s var(--ease-out),filter .15s var(--ease-out)}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .btn-primary{background:linear-gradient(180deg,var(--amber),var(--ember));color:#1a0d06;box-shadow:0 3px 0 #7a3117,0 8px 18px rgba(217,114,74,.28)}
  .btn-secondary{background:linear-gradient(180deg,var(--ink-600),var(--ink-700));color:var(--text);border:1px solid rgba(232,147,90,.2)}
  .btn-danger{background:linear-gradient(180deg,#8b2a20,#5c1a12);color:#ffe9e0;border:1px solid rgba(255,120,90,.28)}
  .btn-accent{background:linear-gradient(180deg,#f4d06e,#d9a63c);color:#2a1a06;font-size:var(--t-lg);
    padding:18px 32px;letter-spacing:1.2px;box-shadow:0 3px 0 #8a6218,0 8px 20px rgba(244,208,110,.25)}

  #game{display:none}
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(164px,1fr));gap:12px;margin-bottom:18px}
  .score-card{position:relative;overflow:hidden;cursor:pointer;text-align:center;
    background:linear-gradient(180deg,var(--ink-700),var(--ink-800));
    border:1px solid rgba(232,147,90,.16);border-radius:var(--r-md);padding:16px 12px;
    transition:border-color .2s var(--ease-out),transform .2s var(--ease-out),box-shadow .2s var(--ease-out),opacity .3s var(--ease-out)}
  .score-card.active{border-color:rgba(232,147,90,.55);transform:translateY(-4px);
    box-shadow:0 0 0 1px rgba(232,147,90,.35),0 10px 26px rgba(0,0,0,.45)}
  .score-card.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    border-radius:var(--r-md) 0 0 var(--r-md);background:linear-gradient(180deg,var(--amber),var(--ember))}
  .score-card.leader{border-color:rgba(143,174,92,.45);box-shadow:inset 0 0 24px rgba(143,174,92,.12)}
  .score-card.leader .name{color:#c6dca6}
  .score-card.leader .total{color:#a9c977}
  .score-card.leader .last{color:#b9d18e}
  .score-card.former-leader{opacity:.55}
  .score-card.eliminated{opacity:.36;filter:grayscale(.65)}
  .score-card .name{font-size:var(--t-md);font-weight:800;letter-spacing:.4px;color:var(--dim);margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score-card .total{font-size:clamp(36px,8.5vw,60px);font-weight:900;line-height:1;color:var(--text);
    font-variant-numeric:tabular-nums;letter-spacing:-1.5px;margin:6px 0}
  .score-card .last{font-size:var(--t-sm);color:var(--amber);min-height:18px;font-weight:700}
  .turn-indicator{margin-top:6px;font-size:var(--t-xs);font-weight:900;letter-spacing:2px;color:var(--amber);
    text-transform:uppercase;min-height:14px}

  .controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .controls input{flex:1;min-width:150px;padding:14px 16px;border-radius:var(--r-sm);
    border:1px solid rgba(232,147,90,.22);background:#120a06;color:var(--text);
    font-size:var(--t-xl);font-family:inherit;font-variant-numeric:tabular-nums}
  .controls input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,157,143,.16)}
  .quick-adds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .quick-adds button{background:linear-gradient(180deg,var(--ink-600),var(--ink-700));color:var(--text);
    border:1px solid rgba(232,147,90,.18);padding:11px 14px;font-size:var(--t-md);border-radius:var(--r-sm);font-weight:800}
  .quick-adds button.common{background:linear-gradient(180deg,rgba(232,147,90,.22),rgba(217,114,74,.12));
    border-color:rgba(232,147,90,.42);color:#ffd9a8;font-size:var(--t-lg);flex:1 1 auto;min-width:74px;text-align:center}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .actions.justify{justify-content:space-between}

  .leaderboard-panel{display:flex;flex-direction:column}
  .leaderboard-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;
    border-bottom:1px solid rgba(232,147,90,.12);font-size:var(--t-md)}
  .leaderboard-entry:last-child{border-bottom:none}
  .leaderboard-entry .rank{width:26px;color:var(--dim);font-weight:800;font-variant-numeric:tabular-nums}
  .leaderboard-entry .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .leaderboard-entry .lscore{color:var(--rank);font-weight:800;font-size:var(--t-sm);letter-spacing:.5px;white-space:nowrap}
  #leaderboard,#setup-leaderboard{overflow-y:auto;max-height:260px}

  .history-panel{background:linear-gradient(180deg,rgba(36,18,9,.72),rgba(16,9,5,.8));
    border:var(--hairline);border-radius:var(--r-lg);padding:16px;max-height:380px;overflow-y:auto;
    box-shadow:inset 0 1px 0 rgba(255,225,190,.05)}
  .history-panel h2{font-size:var(--t-xs);letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-weight:800}
  .history-entry{display:flex;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:1px solid rgba(232,147,90,.1);font-size:var(--t-md)}
  .history-entry:last-child{border-bottom:none}
  .history-entry span:last-child{color:var(--amber);font-weight:800;font-variant-numeric:tabular-nums}
  .error{color:#ff9d84;font-size:var(--t-sm);margin-top:8px;min-height:20px;font-weight:700}

  .announcement{text-align:center;font-size:clamp(19px,4.4vw,32px);font-weight:900;letter-spacing:1.5px;
    text-transform:uppercase;color:#ffd9a8;padding:16px;margin:14px 0;
    text-shadow:0 0 26px rgba(255,140,60,.55),0 2px 4px rgba(0,0,0,.6);
    animation:pulse 1.2s infinite,pop .6s var(--ease-out)}
  .winner-announce{text-align:center;font-size:clamp(26px,5.6vw,50px);font-weight:900;letter-spacing:2px;
    text-transform:uppercase;padding:18px;margin:14px 0;
    background:linear-gradient(180deg,#fff8ec 0%,#ffd08c 40%,#e8622a 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(90,22,6,.9)) drop-shadow(0 8px 20px rgba(255,90,43,.4));
    animation:pulse 1.4s infinite}
  .winner-sub{text-align:center;font-size:var(--t-lg);color:var(--rank);margin-bottom:12px;font-weight:800;letter-spacing:1px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes pop{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

  @media (max-width:820px){
    .row{flex-direction:column}
    .scores{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
    .score-card{padding:13px 9px}
    .quick-adds button{padding:10px;font-size:var(--t-sm)}
    .quick-adds button.common{font-size:var(--t-md);min-width:62px}
    .btn-accent{padding:16px 22px;font-size:var(--t-md)}
    .watermark{width:130px}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><defs>
  <symbol id="sphynx-mono" viewBox="0 0 120 160"><g fill="currentColor"><path d="M42 30C36 22 31 10 27 2C38 6 49 15 55 25Z"/><path d="M78 30C84 22 89 10 93 2C82 6 71 15 65 25Z"/><path d="M50 60h20l3 12c0 6-7 10-13 10s-13-4-13-10z"/><path d="M60 16C71 16 79 23 81 33L82 45C82 54 75 62 67 64L60 66 53 64C45 62 38 54 38 45L39 33C41 23 49 16 60 16Z"/><path d="M60 76C47 76 37 85 35 97C33 111 31 129 31 141C31 147 34 151 40 151H80C86 151 89 147 89 141C89 129 87 111 85 97C83 85 73 76 60 76Z"/><path d="M45 110h13v34c0 3-2 5-5 5h-3c-3 0-5-2-5-5z"/><path d="M62 110h13v34c0 3-2 5-5 5h-3c-3 0-5-2-5-5z"/><path d="M87 140C99 145 111 137 111 124C111 115 105 110 99 112C105 115 108 119 108 124C108 132 100 137 88 134Z"/></g></symbol>
</defs></svg>

<div class="room" aria-hidden="true"><div class="glow g-a"></div><div class="glow g-b"></div></div>

<div id="app">
  <div class="header">
    <div class="brand-row">
      <svg class="crest" viewBox="0 0 120 160" aria-hidden="true"><use href="#sphynx-mono" style="color:#e8935a"/></svg>
      <span class="wordmark"><span class="wm-dollar">$</span><span class="wm-word">GREED</span></span>
    </div>
    <h1>Scoreboard &middot; Rose Island Tournament</h1>
  </div>

  <div id="setup" class="panel">
    <svg class="watermark" viewBox="0 0 120 160" aria-hidden="true"><use href="#sphynx-mono"/></svg>
    <label class="field-label">Players</label>
    <div class="player-rows" id="player-rows"></div>
    <div class="actions">
      <button class="btn-secondary" id="add-player-btn">+ Add Player</button>
      <button class="btn-primary" id="start-btn">Start Game</button>
    </div>
    <label class="field-label">Saved Players (tap to add)</label>
    <div class="quick-adds" id="saved-players"></div>
    <label class="field-label">All-Time Leaderboard</label>
    <div id="setup-leaderboard"></div>
    <div class="error" id="setup-error"></div>
  </div>

  <div id="game">
    <div class="scores" id="scoreboard"></div>
    <div id="banner"></div>

    <div class="row">
      <div class="panel" style="flex:2">
        <label class="field-label">Add Score</label>
        <div class="controls">
          <input type="number" id="score-input" placeholder="Enter score…" min="0" step="50">
          <button class="btn-primary" id="add-btn">+ Add</button>
        </div>
        <div class="quick-adds" id="quick-adds"><button data-score="50">50</button><button data-score="100">100</button><button class="common" data-score="150">150</button><button class="common" data-score="200">200</button><button class="common" data-score="250">250</button><button class="common" data-score="300">300</button><button class="common" data-score="350">350</button><button class="common" data-score="400">400</button><button class="common" data-score="450">450</button><button data-score="500">500</button><button data-score="550">550</button><button data-score="600">600</button><button data-score="650">650</button><button data-score="700">700</button><button data-score="750">750</button><button data-score="800">800</button><button data-score="850">850</button><button data-score="900">900</button><button data-score="950">950</button><button data-score="1000">1000</button></div>
        <div class="actions justify">
          <button class="btn-danger" id="undo-btn">Undo Last</button>
          <button class="btn-accent" id="next-btn">NO SCORE</button>
        </div>
      </div>

      <div class="panel leaderboard-panel" style="flex:1">
        <label class="field-label">All-Time Leaderboard</label>
        <div id="leaderboard"></div>
        <svg class="panel-mark" viewBox="0 0 120 160" aria-hidden="true"><use href="#sphynx-mono"/></svg>
      </div>
    </div>

    <div class="actions">
      <button class="btn-danger" id="reset-btn">NEW GAME</button>
    </div>

    <div class="history-panel">
      <h2>Round History</h2>
      <div id="history"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const setupEl = document.getElementById('setup');
  const gameEl = document.getElementById('game');
  const playerRows = document.getElementById('player-rows');
  const addPlayerBtn = document.getElementById('add-player-btn');
  const startBtn = document.getElementById('start-btn');
  const startErr = document.getElementById('setup-error');
  const bannerEl = document.getElementById('banner');
  const scoreboard = document.getElementById('scoreboard');
  const scoreInput = document.getElementById('score-input');
  const addBtn = document.getElementById('add-btn');
  const undoBtn = document.getElementById('undo-btn');
  const nextBtn = document.getElementById('next-btn');
  const historyEl = document.getElementById('history');

  let players = [];
  let current = 0;
  let history = [];
  let gameRunning = false;
  let endMode = false;
  let endModeTriggerIdx = -1;
  let endTurnsRemaining = [];
  let winnerDeclared = false;
  const PHRASE_KEY = 'greed-phrase-seed-v1';
  function seededRand() {
    let s = 0;
    try {
      const raw = localStorage.getItem(PHRASE_KEY) || '';
      for (let i = 0; i < raw.length; i++) s = (s + raw.charCodeAt(i) * 31) >>> 0;
    } catch { s = Math.random() * 0xffff; }
    s = (s + 1) >>> 0;
    localStorage.setItem(PHRASE_KEY, s.toString());
    return (s % 10000) / 10000;
  }

  function refreshDeleteButtons() {
    const count = playerRows.querySelectorAll('.player-row').length;
    playerRows.querySelectorAll('.del-player').forEach(btn => {
      btn.disabled = count <= 2;
    });
  }

  function addPlayerRow(name = '') {
    const row = document.createElement('div');
    row.className = 'player-row';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'pname';
    inp.placeholder = 'Player name';
    inp.value = name;
    const del = document.createElement('button');
    del.className = 'del-player';
    del.textContent = '✕';
    del.type = 'button';
    del.addEventListener('click', () => { row.remove(); refreshDeleteButtons(); });
    row.appendChild(inp);
    row.appendChild(del);
    playerRows.appendChild(row);
    refreshDeleteButtons();
    inp.focus();
  }

  addPlayerBtn.addEventListener('click', () => {
    if (playerRows.querySelectorAll('.player-row').length >= 6) return;
    addPlayerRow();
    renderSavedPlayers();
  });

  function getPlayerNames() {
    return Array.from(playerRows.querySelectorAll('.pname')).map(i => i.value.trim()).filter(Boolean);
  }

  const SAVED_KEY = 'greed-saved-players-v1';
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch { return []; }
  }
  function saveNames(names) {
    const merged = Array.from(new Set([...loadSaved(), ...names]));
    localStorage.setItem(SAVED_KEY, JSON.stringify(merged));
  }
  function renderSavedPlayers() {
    const saved = loadSaved();
    const existing = new Set(getPlayerNames());
    const container = document.getElementById('saved-players');
    container.innerHTML = saved.map(n => {
      const disabled = existing.has(n) ? ' style="opacity:.4;pointer-events:none;"' : '';
      return `<button class="btn-secondary" data-saved="${n}"${disabled}>${n}</button>`;
    }).join('');
    container.querySelectorAll('button[data-saved]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.saved;
        if (getPlayerNames().includes(name)) return;
        addPlayerRow(name);
        renderSavedPlayers();
      });
    });
  }

  const LEADER_KEY = 'greed-leaderboard-v1';
  function loadLeaderboard() {
    try {
      const raw = localStorage.getItem(LEADER_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }
  function recordWin(name) {
    try {
      const board = loadLeaderboard();
      const existing = board.find(b => b.name === name);
      if (existing) {
        existing.wins = (existing.wins || 0) + 1;
      } else {
        board.push({ name, wins: 1 });
      }
      board.sort((a, b) => (b.wins || 0) - (a.wins || 0));
      localStorage.setItem(LEADER_KEY, JSON.stringify(board.slice(0, 50)));
    } catch {
      // localStorage disabled or full; fail silently
    }
  }
  function renderLeaderboard() {
    const board = loadLeaderboard();
    const gameElLeaderboard = document.getElementById('leaderboard');
    const setupLeaderboard = document.getElementById('setup-leaderboard');
    if (!gameElLeaderboard && !setupLeaderboard) return;
    const html = board.length ? board.slice(0, 20).map((e, i) => `
      <div class="leaderboard-entry">
        <span class="rank">${i+1}.</span>
        <span class="lname" title="${e.name}">${e.name}</span>
        <span class="lscore">${e.wins || 0} win${(e.wins || 0) === 1 ? '' : 's'}</span>
      </div>
    `).join('') : '<div style="color:#f0d5a8;padding:8px 0;">No games played yet. First to hit 5000+ wins a title.</div>';
    if (gameElLeaderboard) gameElLeaderboard.innerHTML = html;
    if (setupLeaderboard) setupLeaderboard.innerHTML = html;
  }

  startBtn.addEventListener('click', () => {
    startErr.textContent = '';

  function findHighestScorer() {
    if (players.length === 0) return -1;
    const max = Math.max(...players.map(p => p.total));
    const tie = players.map((p, i) => p.total === max ? i : -1).filter(i => i !== -1);
    if (tie.length === 1) return tie[0];
    return tie[0];

  function pickAnnouncement(score, name) {
    return pickScorePhrase(score, name);
  }

  function pickScorePhrase(score, name) {
    const rand = seededRand();
    const useInnuendo = rand < 0.05;
    if (useInnuendo) return PHRASES_INNUENDO[Math.floor(seededRand() * PHRASES_INNUENDO.length)].replace(/\{name\}/g, name);
    if (score < 100) return PHRASES_BAD[Math.floor(seededRand() * PHRASES_BAD.length)].replace(/\{name\}/g, name);
    if (score <= 450) return PHRASES_NORMAL[Math.floor(seededRand() * PHRASES_NORMAL.length)].replace(/\{name\}/g, name);
    return PHRASES_HIGH[Math.floor(seededRand() * PHRASES_HIGH.length)].replace(/\{name\}/g, name);
  }

  function pickNoScorePhrase(name) {
    return PHRASES_NO_SCORE[Math.floor(seededRand() * PHRASES_NO_SCORE.length)].replace(/\{name\}/g, name);
  }

  function pickNoScoreAnnouncement(name) {
    const text = PHRASES_NO_SCORE[Math.floor(seededRand() * PHRASES_NO_SCORE.length)].replace(/\{name\}/g, name);
    flashAnnouncement(text);
  }

  function rollScorePhrase(score, name) {
    const rand = seededRand();
    const useInnuendo = rand < 0.05;
    if (useInnuendo) return PHRASES_INNUENDO[Math.floor(seededRand() * PHRASES_INNUENDO.length)].replace(/\{name\}/g, name);
    if (score < 100) return PHRASES_BAD[Math.floor(seededRand() * PHRASES_BAD.length)].replace(/\{name\}/g, name);
    if (score <= 450) return PHRASES_NORMAL[Math.floor(seededRand() * PHRASES_NORMAL.length)].replace(/\{name\}/g, name);
    return PHRASES_HIGH[Math.floor(seededRand() * PHRASES_HIGH.length)].replace(/\{name\}/g, name);
  }

  function pickScorePhrase(score, name) {
    return rollScorePhrase(score, name);
  }

  function flashAnnouncement(text) {
    const el = document.createElement('div');
    el.className = 'announcement flash-announce';
    el.textContent = text;
    bannerEl.innerHTML = '';
    bannerEl.appendChild(el);
  }
  
  function cardClasses(i) {
    const cur = i === current;
    const highest = findHighestScorer();
    if (winnerDeclared) {
      return highest === i ? 'leader' : 'eliminated';
    }
    if (!endMode) {
      return cur ? 'active' : '';
    }
    if (highest === i) return 'leader' + (cur ? ' active' : '');
    if (endTurnsRemaining[i].remaining === 0) return 'eliminated';
    return cur ? 'active' : '';
  }

  function render() {
    const highest = findHighestScorer();
    let banner = '';
    if (winnerDeclared) {
      const tied = players.filter((_, i) => players[i].total === players[highest].total);
      if (tied.length > 1) {
        banner = `<div class="winner-announce">TIE</div>`;
      } else {
        banner = `<div class="winner-announce">WINNER: ${players[highest].name}</div>
                  <div class="winner-sub">${players[highest].total.toLocaleString()} points</div>`;
      }
    } else if (endMode) {
      banner = '<div class="announcement">WE ARE IN THE END TIMES</div>';
    }
    if (!bannerEl.querySelector('.flash-announce')) bannerEl.innerHTML = banner;

    scoreboard.innerHTML = players.map((p, i) => {
      const cls = cardClasses(i);
      const turnIndicator = (!winnerDeclared && i === current)
        ? '<div class="turn-indicator">YOUR TURN</div>'
        : '';
      return `
        <div class="score-card ${cls}" data-i="${i}">
          <div class="name" title="${p.name}">${p.name}</div>
          <div class="total">${p.total.toLocaleString()}</div>
          <div class="last">${p.last !== null ? '+'+p.last : ''}</div>
          ${turnIndicator}
        </div>
      `;
    }).join('');

    if (!gameRunning || winnerDeclared) return;
    scoreboard.querySelectorAll('.score-card').forEach(card => {
      card.addEventListener('click', () => {
        current = parseInt(card.dataset.i);
        render();
        scoreInput.focus();
      });
    });

    historyEl.innerHTML = history.length ? history.slice().reverse().map(h =>
      `<div class="history-entry"><span>${h.player}</span><span>+${h.score.toLocaleString()}</span></div>`
    ).join('') : '<div style="color:#f0d5a8;padding:8px 0;">No scores yet</div>';

    renderLeaderboard();
  }

  function addScore(score) {
    if (!gameRunning) return;
    score = Math.max(0, parseInt(score) || 0);
    const i = current;
    players[i].last = score;
    players[i].total += score;
    history.push({ player: players[i].name, score });
    scoreInput.value = '';

    if (!endMode && players[i].total >= 5000) {
      endMode = true;
      endModeTriggerIdx = i;
      endTurnsRemaining = players.map((_, idx) => ({
        remaining: idx === i ? 0 : 1
      }));
      bannerEl.innerHTML = '<div class="announcement">WE ARE IN THE END TIMES</div>';
    }

    if (endMode) {
      endTurnsRemaining[i].remaining = Math.max(0, (endTurnsRemaining[i].remaining || 0) - 1);
      const allDone = endTurnsRemaining.every(r => r.remaining === 0);
      if (allDone) {
        winnerDeclared = true;
        const topScore = Math.max(...players.map(p => p.total));
        players.filter(p => p.total === topScore).forEach(p => recordWin(p.name));
        render();
        return;
      }
    }

    if (!endMode && !winnerDeclared && score > 0) {
      const name = players[i].name;
      const text = pickAnnouncement(score, name);
      flashAnnouncement(text);
    }

    advance();
    render();
    scoreInput.focus();
  }

  function advance() {
    const n = players.length;
    let next = (current + 1) % n;
    let tries = 0;
    while (tries < n) {
      if (!endMode || (endTurnsRemaining[next] && endTurnsRemaining[next].remaining > 0)) break;
      next = (next + 1) % n;
      tries++;
    }
    current = next;
  }

  addBtn.addEventListener('click', () => addScore(scoreInput.value));
  scoreInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addScore(scoreInput.value);
  });

  document.querySelectorAll('#quick-adds button').forEach(btn => {
    btn.addEventListener('click', () => addScore(btn.dataset.score));
  });

  nextBtn.addEventListener('click', () => {
    if (!gameRunning || winnerDeclared) return;
    if (endMode) {
      addScore(0);
      return;
    }
    const i = current;
    const name = players[i].name;
    pickNoScoreAnnouncement(name);
    advance();
    render();
    scoreInput.focus();
  });

  // UNDO ALWAYS AVAILABLE
  undoBtn.addEventListener('click', () => {
    if (!history.length) return;
    const last = history.pop();
    const pid = players.findIndex(p => p.name === last.player);
    if (pid === -1) return;

    if (endMode && endTurnsRemaining[pid]) {
      endTurnsRemaining[pid].remaining += 1;
    }

    players[pid].total -= last.score;
    players[pid].last = null;

    // if undoing the trigger back below 5000, cancel end mode
    if (endMode) {
      const anyHigh = players.some((p, idx) => p.total >= 5000 && endTurnsRemaining[idx] && endTurnsRemaining[idx].remaining > 0);
      if (!anyHigh) {
        endMode = false;
        endModeTriggerIdx = -1;
        endTurnsRemaining = players.map(() => ({ remaining: 0 }));
      }
    }

    winnerDeclared = false;
    current = pid;
    render();
    scoreInput.focus();
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Reset everything and return to setup?')) return;
    gameRunning = false;
    players = [];
    history = [];
    setupEl.style.display = 'block';
    gameEl.style.display = 'none';
    bannerEl.innerHTML = '';
    winnerDeclared = false;
    endMode = false;
    endModeTriggerIdx = -1;
    endTurnsRemaining = [];
    playerRows.innerHTML = '';
    refreshDeleteButtons();
    renderSavedPlayers();
    renderLeaderboard();
  });

  refreshDeleteButtons();
  renderSavedPlayers();
  renderLeaderboard();
})();
